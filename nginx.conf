server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Root redirects to /doc-record
    location = / {
        return 301 /doc-record/;
    }

    # Serve /doc-record - alias maps /doc-record/ to /usr/share/nginx/html/
    location ^~ /doc-record/ {
        alias /usr/share/nginx/html/;
        index index.html;
        # Direct file, directory, directory with trailing slash, named location for SPA
        try_files $uri $uri/ $uri.html =404;
        
        # For SPA - if 404, serve index.html
        error_page 404 = @docusaurus;
    }
    
    # SPA fallback for Docusaurus
    location @docusaurus {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Error pages
    error_page 404 /404.html;
}
