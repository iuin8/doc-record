name: Progressive Docusaurus Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Stage 1: Fast Build & Deploy
  # 快速构建并部署，让用户第一时间看到内容（未翻译）
  build-fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}

      - name: Install Dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      - name: Build Docusaurus (Fast)
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-fast
          path: ./build

  deploy-fast:
    needs: build-fast
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-fast

  # Stage 2: Crowdin Sync & Final Deploy
  # 在快速部署完成后，执行耗时的翻译同步，并再次部署最终版本
  build-final:
    needs: deploy-fast
    runs-on: ubuntu-latest
    environment: github-pages  # 指定环境
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}

      - name: Install Dependencies (If Cache Miss)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      - name: Generate Translations
        # 生成默认语言的国际化配置(导航, 页脚等)
        run: npm run write-translations

      - name: Sync Crowdin
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          # Try to upload, but continue if it fails (e.g. no sources found)
          npm run crowdin -- upload --token $CROWDIN_PERSONAL_TOKEN || true
          # Always attempt to download
          npm run crowdin -- download --token $CROWDIN_PERSONAL_TOKEN || true

      - name: Build Docusaurus (Final)
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-final
          path: ./build

  deploy-final:
    needs: build-final
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-final
