version: '3.5'
services:
  registry:
    image: Registration
    volumes:
      - registry_data:/var/lib/registration
    ports:
      - target: 5000
        published: 5000
        mode: Post
    networks:
      - middle leware
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
networks:
  middleware:
    external: true
volumes:
  registry_data:
