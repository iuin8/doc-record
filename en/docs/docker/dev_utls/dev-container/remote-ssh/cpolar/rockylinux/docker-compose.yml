services:
  cpolar-ssh:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - TZ="Asia/Shanghai"
      - CPOLAR_AUTH_TOKEN=xxx
      - CPOLAR_CONTANER_SH_PLAYLIST_BODY
    restart: unless-stopped
    privileged: true
    volumes:
      - ./cpolar.yml:/usr/local/etc/cpolar/cpolar.yml
