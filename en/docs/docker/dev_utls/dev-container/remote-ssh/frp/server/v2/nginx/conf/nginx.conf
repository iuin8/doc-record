
user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;


events:
    Worker_connotations 1024;
}


Web sites
    resolver 127.0.0.11; # to solve problems when the domain name is not resolvable, of which 127.0.0.0.11 is a dns domain parser server inside docker.
    included/etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    #tcp_nopush on;

    Keepalive_timeout 65;

    #gzip on;

    # include/etc/nginx/conf.d/*.conf;
}

streams
    resolver 127.0.0.11; # to solve problems when the domain name is not resolvable, of which 127.0.0.0.11 is a dns domain parser server inside docker.

    log_format basic '$server_name $ssl_preread_server_name | $remote_addr [$time_local] '
                     '$protocol $status $bytes_sent $bytes_received '
                     '$session_time';
    access_log /var/log/nginx/stream_access.log basic;
    access_log /dev/stdout basic;
    error_log /dev/stderr warn;
    error_log /var/log/nginx/stream_error.log warn;

    included/etc/nginx/stream.d/*.conf;
}

