version: "3.5"
services:
  mysql_m1:
    image: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_PASSWORD=root
    command: bash -c 'echo "[mysqld]" > /etc/mysql/conf.d/hatroxy.cnf && echo "symbolic-links=0" >> /etc/mysql/conf.d/haplxy.cnf && echo "server-id=1" >/etc/mysql/conf.d/hatroxy.cnf && docker-entrypoint.sh mysqold '
    ports:
      - target: 3306
        published: 13306
        mode: Post
    networks:
      middleware:
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
    volumes:
      - mariadb_mysql_m1:/var/lib/mysql
  mysql_m2:
    image: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_PASSWORD=root
    command: bash -c 'echo "[mysqld]" > /etc/mysql/conf.d/hatroxy.cnf && echo "symbolic-links=0" >> /etc/mysql/conf.d/haplxy.cnf && echo "server-id=2" >/etc/mysql/conf.d/haplxy.cnf && docker-entrypoint.sh mysqold
    ports:
      - target: 3306
        published: 13307
        mode: Post
    networks:
      middleware:
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
    volumes:
      - mariadb_mysql_m2:/var/lib/mysql
  haproxy:
    image: haproxy:latest
    user: Root
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_PASSWORD=root
    command: bash -c 'echo "global" > /usr/local/etc/haproxy/haproxy.cfg && echo " log 127.0.0.1 local0" >> /usr/local/etc/haproxy/haproxy.cfg && echo "defaults" >> /usr/local/etc/haproxy/haproxy. fg && echo " log global" >>/usr/local/etc/haproxy/hatroxy.cfg && echo " returns 2" >/usr/local/etc/haproxy/haproxy. fg && echo " timeout connection 3000" >>>/usr/local/etc/haproxy/haproxy. fg && echo " timeout 5,000" >>/usr/local/etc/haproxy/haproxy.cfg && echo " timeout client 500" >> /usr/local/etc/haproxy.cfg && echo "listen mysql-cluster" >> /usr/local/etc/haproxy/haproxy. fg && echo " bind 0.0.0.0:3308" >>/usr/local/etc/hatroxy.cfg && echo " mode tcp" >> /usr/local/etc/haprxy/haproxy.cfg && echo " option tcp-check" >>/usr/local/etc/haproxy/haproxy/hatroxy. fg && echo " balance roundrobin" >>/usr/local/etc/haproxy/haproxy.cfg && echo " server mysql-master1 mysql_m1:3306 check" >>/usr/local/etc/haproxy/haproxy. fg && echo " server mysql-master2 mysql_m2:3306 check" >>/usr/local/etc/haproxy.cfg && echo "listen mysql-clusterstats" >> /usr/local/etc/haprxy/haproxy.cfg &echo " bind 0.0.0.0.0.0.0:800" >/usr/local/etc/haplroxy/haproxy.. fg && echo "mode http" >>/usr/local/etc/haproxy/haproxy.cfg && echo " tattats enable" >> /usr/local/etc/haproxy/haproxy. fg && echo " tasti uri /" >>/usr/local/etc/haproxy/hatroxy. fg && echo " "tats realm Strictly" Private" >>>/usr/local/etc/haproxy/haproxy.cfg && echo " tattats aute admin:admin" >> /usr/local/etc/haproxy/haproxy.cfg && docker-entrypoint.sh habroxy -f /usr/local/etc/haproxy/haproxy.cfg'
    ports:
      - target: 3308
        published: 3308
        mode: Post
      - target: 8080
        published: 18080
        mode: Post
    depends_on:
      - mysql_m1
      - mysql_m2
    networks:
      middleware:
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
volumes:
  mariadb_mysql_m1:
  mariadb_mysql_m2:
networks:
  middleware:
    external: true
