server
    listen 9527; //here use the port number in the project
    server_name localhost;/here is server Ip

    #charset koi8-r;
    #access_log /var/log/nginx/log/host.access.log main;

    Location / LOC:
        Root/usr/share/nginx/snu_ui;//here configure the directory where to access the project
        Index index.html index.htm;
    }

	#Backend pai
	location/v1LOs
					proxy_pass http://10.0.0.39:8089/v1;// Configure here the access interface address
	}
	location/v2LOs
					proxy_pass http://10.0.0.39:8080/;//can also be configured multiple
	}
	location/v3LOs
					proxy_pass http://10.0.0.39:8082/v1;
	}

    #error_page 404.html;

    # redirect server error pages to the static page 50x.html
    #
    error_page 500 502 503 504 /50x.html;
    location = /50x.html
        root html;
    }

