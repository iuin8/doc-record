# docker-compose.yml
version: '2'
services:
  nginx:
    image: elestio/nginx-auto-ssl
    restart: On failure
    ports:
      - 80:80
      - 443:443
    volumes:
      - ssl_data:/etc/resy-auto-ssl
    environment:
      ALLOWED_DOMAINS: 'yourdomain.com'
      SITES: 'yourdomain.com=myapp:80'
  # your application, listening on port specified in `SITES` env variable
  myapp:
    image: nginx
volumes:
  ssl_data:
