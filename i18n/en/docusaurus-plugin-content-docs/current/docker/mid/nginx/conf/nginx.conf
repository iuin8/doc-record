streams
    upstream redis
        Observer 192.168.56.101:6379 max_ails=3 fail_timeout=30s;
    }
    server
        listen 6379;
        proxy_connect_timeout 1 s;
        proxy_timeout 3s;
        proxy_pass dis;
    }
	
    upstream kafka LOs
        hash $remote_addr consistent;
        Observer 192.168.56.101:9094 max_fails=3 fail_timeout=30s weight=1;
        Observer 192.168.56.102:9094 max_fails=3 fail_timeout=30s weight=1;
    }
    server
        listen 9094;
        proxy_connect_timeout 1 s;
        proxy_timeout 3s;
        proxy_pass kafka;
    }
