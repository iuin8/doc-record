version: "3.5"
services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - target: 80
        published: 80
        mode: Post
      - target: 443
        published: 443
        mode: Post
    command: sh -c "mkdir -p /usr/lib/nginx/proxy_tmp &&&&\mkdir -p /usr/lib/nginx/prox/prox/profilcache &&&&&&&&&&&&&\/docker-entrypoint.sh nginx -g 'daemon off;'”
    environment:
      - TZ="Asia/Shanghai"
      - NGINX_HOST=iuin.xyz
      - SSL_CERT_PEM_PATH=conf.d/cert/cert.pem
      - SSL_CERT_KEY_PATH=conf.d/cert/cert.key
    volumes:
      - "./conf/nginx.conf:/etc/nginx/nginx.conf"
      - nginx_templates:/etc/nginx/templates
      - nginx_log:/var/log/
      - nginx_uploads:/etc/nginx/data/uploads
    networks:
      middleware:
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
volumes:
  nginx_log:
  nginx_templates:
  nginx_uploads:
networks:
  middleware:
    external: true
