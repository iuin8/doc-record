version: "3.5"
services:
  nginx:
    image: nginx:1.20-last # 使用Dockerfile构建的镜像，(docker build -t nginx:1.20-ext .)
    environment:
      TZ: "Asia/Shanghai"
    command: bash -c "mkdir -p /usr/lib/nginx/proxy_tmp &&&&\mkdir -p /usr/lib/nginx/prox/proxy_&&&&&&&&&&&&&&\/docker-entrypoint.sh nginx -g 'daemon off;'”
    networks:
      middleware:
    ports:
      - target: 80
        published: 80
        mode: Post
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
    volumes:
      - "/etc/localtime:/etc/localtime"
      - "nginx_log:/var/log/"
      - "nginx_conf.d:/etc/nginx/conf.d"
      - "nginx_uploads:/etc/nginx/data/uploads"
volumes:
  nginx_log:
  nginx_uploads:
  nginx_conf.d:
networks:
  middleware:
    external: true
