version: '3.5'
services:
  rabbitmq:
    image: rabbitmq:management
    ports:
      - 15673:15672
      - 5673:5672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABITMQ_DEFAULT_USER=admin
      - ABBITMQ_DEFAULT_PAS=123456
    networks:
      - middle leware
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
networks:
  middleware:
    external: true
volumes:
  rabbitmq_data:
