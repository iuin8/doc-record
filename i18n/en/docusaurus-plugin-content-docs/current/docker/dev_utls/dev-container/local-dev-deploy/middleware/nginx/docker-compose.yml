version: "3.5"
services:
  nginx:
    image: nginx:1.20
    user: Root
    privileged: true
    environment:
      TZ: "Asia/Shanghai"
    command: bash -c "mkdir -p /usr/lib/nginx/proxy_tmp &&&&\mkdir -p /usr/lib/nginx/prox/proxy_&&&&&&&&&&&&&&\/docker-entrypoint.sh nginx -g 'daemon off;'”
    networks:
      middleware:
    ports:
      - target: 8888
        published: 8888
        mode: Post
      - target: 9999
        published: 9999
        mode: Post
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
    volumes:
      - "nginx_log:/var/log/"
      - "./conf/nginx.conf:/etc/nginx/nginx.conf"
      - "./conf/cors.conf:/etc/nginx/cors.conf"
      - "./conf/conf.d/etc/nginx/conf.d/"
      - /home/data/file//etc/nginx/data/uploads
volumes:
  nginx_log:
#   nginx_uploads:
networks:
  middleware:
    external: true
