upstream fa_ssh
    # server fa.intranet.company:22;
    Observer 10.0.146:12222;
}

upstream frps LOs
    server frps-ssh:70000;
}

# 使用 map 根据 $ssl_preread_server_name 区分流量（即使没有 SSL，也能用 SNI）
map $ssl_preread_server_name $backend {
    "frps.xxx.com" frps;
    "fa_ssh.xxx.com" fa_ssh;
    default frps; # default proxy SSH
}

# Listen to port (TTPS/TLS default port), but actual proxy only TCP
server
    listen 443;
    ssl_premier ead on; # Enable SNI parse (Reading domain even without SSL)

    # proxy_connect_timeout 1h;
    # proxy_timeout 1h;
    # Proxy to different upstream based on map results
    proxy_pass $backend;
}
