edition: 1.0.0
name: noocobase-app
access: "default"
vars:  # 全局变量
  region: "cn-hangzhou"
  image_namespace: "a"
  image_name: "noobase: v1-fa"
  service:
    name: "noocobaseService"
    nasConfig: auto
services:
  nocobaseService:
    component: fc
    actions:
      pre-deploy:
        - component: fc build --use-docker --dockerfile ./src/Dockerfile
    # post-deploy:
    #   - component: fc nas upload -ro /src/storage/db /mnt/auto/nocobase/storage/db
    props:
      region: '${vars.region}'
      service: '${vars.service}'
      function:
        name: "noocobaseFc"
        codeUri: './src'
        runtime: custom-container
        timeout: 60
        memorySize: 512
        instanceConcurrency: 100
        caPort: 13000
        customContainerConfig:
          image: "registry.${vars.region}.aliyuncs.com/${vars.image_namespace}/${vars.image_name}"
      triggers:
        - name: httpTrigger
          type: country_pc
          config:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - HEAD
              - OPTITONS
      customDomains:
        - domainName: Auto
          protocol: HTTP
          routeConfigs:
            - path: /*
