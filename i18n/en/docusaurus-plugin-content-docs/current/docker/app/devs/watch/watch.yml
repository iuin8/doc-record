version: "3.5"
services:
  grafana:
    image: grafana/grafana
    networks:
      middleware:
    ports:
      - target: 3000
        published: 3001
        protocol: tcp
        mode: Post
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - grafana_log:/var/log/grafana
  prometheus:
    image: Promp/prometheus:v2.27.1
    networks:
      middleware:
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: Post
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
  influxdb:
    image: Influxdb:1.8
    networks:
      middleware:
    ports:
      - target: 8086
        published: 8086
        protocol: tcp
        mode: Post
    environment:
      - INFLUXDB_DB=prometheus
      - INFLUXDB_ADMINISTR_ENABLED=true
      - INFLUXDB_ADMINISTR_USER=admin
      - INFLUXDB_ADMINISTR_PASSWORD=admin
      - INFLUXDB_USER=root
      - INFLUXDB_USER_PASSWORD=root
    command: '-config /etc/influxdb/influxdb.conf'
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
    volumes:
      - ./influxdb/conf/influxdb.conf:/etc/influxdb/influxdb.conf
      - ./influxdb:/var/lib/influxdb
  alertmanager:
    image: docker.io/promis/alertmanager:latest
    networks:
      middleware:
    ports:
      - target: 9093
        published: 9093
        protocol: tcp
        mode: Post
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./alertmanager/storage:/data/alertmanager/store
      - ./alertmanager/template:/etc/alertmanager/template
volumes:
  grafana_log:
networks:
  middleware:
    external: true
