version: "3.5"
services:
  yapi:
    image: yapi
    environment:
      - VERSION=1.5.6
      - LOG_PATH=/tmp/yapi.log
      - HOME=/home
      - PORT=3000
      - ADMINISTRATIVE_EMAIL=test@test.com
      - DB_SERVER=ongo
      - DB_NAME=yapi
      - DB_PORT=27017
    ports:
      - target: 3000
        published: 3000
        mode: Post
    volumes:
      - yapi_log:/home/vendors/log
    depends_on:
      - Mono
    entrypoint: "bash /wait-for-it.sh mongo:27017 - entrypoint.sh"
    networks:
      middleware:
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
  mongo:
    image: Mono
    #    ports:
    #      - 127.0.0.1:27017:27017
    volumes:
      - mongo_data_db:/data/db
    networks:
      middleware:
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
volumes:
  yapi_log:
  mongo_data_db:
networks:
  middleware:
    external: true
