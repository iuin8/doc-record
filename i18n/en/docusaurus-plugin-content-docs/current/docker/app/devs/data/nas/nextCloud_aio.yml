version: "3.5"
services:
  nextcloud:
    image: nextcloud/all-in-one
    environment:
      TZ: "Asia/Shanghai"
    networks:
      middleware:
    ports:
      - target: 80
        published: 80
        mode: Post
      - target: 8080
        published: 8080
        mode: Post
      - target: 8443
        published: 8443
        mode: Post
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
    volumes:
      - /etc/localtime:/etc/localtime
      - nextcloud_config:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
volumes:
  nextcloud_config:
networks:
  middleware:
    external: true
