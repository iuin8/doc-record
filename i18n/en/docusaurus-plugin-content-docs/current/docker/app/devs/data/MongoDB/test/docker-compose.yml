version: '3.5'
services:
  mongo:
    image: mono
    ports:
      - target: 27017
        published: 27017
        mode: Post
    volumes:
      - ./setup:/docker-entrypoint-initdb.d/
    environment:  # admin账号和密码
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: DoNotPeek
    networks:
      - middle leware
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
  # 如果不需要MongoDB的网页端，以下内容可以不加
  mongo-express:
    image: mongo-express
    ports:
      - target: 8081
        published: 8081
        mode: Post
    environment:  # 这里只能使用与上方MONGO_INITDB_ROOT_USERNAME相同的root账号
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: DoNotPeek
    depends_on:
      - mono
    networks:
      - middle leware
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
networks:
  middleware:
    external: true
