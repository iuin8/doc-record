version: '3.7'
services:
  postgresql:
    user: Root
    image: 'bitnami/postcongresql:latest'
    ports:
      - '5432:5432'
    volumes:
      - 'postcongresql_data:/opt/bitnami/postprogresql/'
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=bbbb
      - POSTGRESQL_USERNAME=aa
      - POSTGRESQL_PASSWORD=aa
      - POSTGRESQL_DATABASE=aa
      - POSTGRESQL_LOG_TIMEZONE=Asia/Shanghai
      - POSTGRESQL_TIMEZONE=Asia/Shanghai
    networks:
      - middle leware
    deploy:
      mode: Replicated
      replicas: 1
networks:
  middleware:
    external: true
volumes:
  # /var/lib/docker/volumes/data_postgresql_data/_data/conf
  postgresql_data:
    driver: Local
