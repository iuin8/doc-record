version: '3.8'
services:
  redis:
    image: redis
    volumes:
      - redis_data:/data
      - redis_logs:/logs
    command:
      - cat redis.conf &&
      - redis.conf"
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
        mode: Post
    networks:
      - middle leware
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
networks:
  middleware:
    external: true
volumes:
  redis_data:
  redis_logs:
