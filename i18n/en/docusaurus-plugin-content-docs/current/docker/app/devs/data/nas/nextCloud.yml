version: "3.5"
services:
  mariadb:
    image: mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    command: '--transaction-isolation=READ-COMMITTED --binlog-form=ROW --innodb_read_only_compressed=0'
    networks:
      middleware:
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
    volumes:
      - mariadb_mysql:/var/lib/mysql
  nextcloud:
    image: nextcloud
    environment:
      - TZ="Asia/Shanghai"
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=mariadb
    networks:
      middleware:
    ports:
      - target: 80
        published: 80
        mode: Post
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
    volumes:
      - nextcloud_html:/var/www/html
volumes:
  nextcloud_html:
  mariadb_mysql:
networks:
  middleware:
    external: true
