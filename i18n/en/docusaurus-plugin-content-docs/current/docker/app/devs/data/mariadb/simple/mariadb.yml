version: "3.5"
services:
  mariadb:
    image: mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_PASSWORD=root
    ports:
      - target: 3306
        published: 3306
        mode: Post
    networks:
      middleware:
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
    volumes:
      - mariadb_mysql:/var/lib/mysql
volumes:
  mariadb_mysql:
networks:
  middleware:
    external: true
