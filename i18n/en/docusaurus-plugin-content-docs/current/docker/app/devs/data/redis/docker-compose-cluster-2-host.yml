# 一主一从配置(可配合docker-compose-cluster-6.yml搭建哨兵)
version: '3.9'
services:
  master:
    image: redis:6.0
    networks:
      hostnet: { }
    ports:
      - 6379:6379
    command: bash -c "echo 'port 6379' > redis.conf &echo 'requirepass foobared' >> redis.conf && echo 'masterauth foobared' >> redis.conf && cat disdisdisdisdisdis.conf && redisconnect
    volumes:
      - /etc/localtime:/etc/localtime:ro
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
  slave-1:
    image: redis:6.0
    networks:
      hostnet: { }
    command:
      - echo 'slave-announcement-ip lave-1' >> redis.conf &&
      - cat redis.conf &&
      - redis.conf"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
networks:
  hostnet:
    external: true
    name: Post
