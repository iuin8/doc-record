version: '3.8'
# 部署多主多从(测试版)
services:
  redis1:
    image: redis:6.0
    networks:
      - middle leware
    ports:
      - 7001:7001
    command: bash -c "echo 'port 7001' > redis.conf &echo 'bind 0.0.0.0' >> redis. onf && echo 'protected-mode no' >> redis.conf &echo 'cluster-enabled yes>> redis. onf && echo 'appendonly yes' >> redis.conf &echo 'requirepass foobared' >> redis. onf && echo 'masterauh foobared' >> resdisconf && cat redisdis.conf && rediso-server disdisdisdisdisdisdisdisdisdisdisdis.conf "
    volumes:
      - /etc/localtime:/etc/localtime:ro
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
  redis2:
