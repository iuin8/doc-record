# Redis configuration file example.
#
# Note that in order to read the configuration file, Redis must be
# started with the file path as first argument:
#
# ./redis-server /path/to/redis.conf

# Note on units: when memory size is needed, it is possible to specify
# it in the common form of 1k 5GB 4M and so forth:
#
# 1k => 1000 bytes
# 1kb => 1024 bytes
# 1m => 100000 bytes
# 1mb => 1024*1024 bytes
# 1g => 100000bytes
# 1gb => 1024*1024*1024 bytes
#
# units are case insensitive so 1GB are all the same.

################################ INCLUDES ##################################################################################

# Include one or more config files here.  This is useless if you
# have a standard template that goes to all Redis servers but also needed
# to customize a few per-server settings.  Include files
# other files, so use this wisely.
#
# Note that option "include" won is written by command "CONFIG REWRITE"
# from admin or Redis Sentinel. Since Redis ways use the last process
# line as value of a configuration directive, you'd better input included
# at the beginning of this file to avoid overwriting config change at runtime.
#
# If you are interested in using configuration
# options, it is better to use including as the last line.
#
# included /path/to/local.conf
# included/path/to/other.conf

################################## MODULES ################################################################################

# Load modules at startup. If the server is not able to load modules
# it will abort. It is possible to use multiple loadmodules directives.
#
# loadmodule /path/to/my_module.so
# loadmodule /path/to/other_module.so

############################ NETWORK ##################################################################################################

# By default, if no "bind" configuration direction is specified, Redis listens
# for elections from all available network interfaces on the host machine.
# It is possible to list one or multiple interfaces using
# the "bind" configuration directive, followed by one or more IP addresses.
#
# Examples:
#
# bind 192.168.1.1.1.1.100 10.0.1
# bind 127.0.0.1 :1
#
~~WARNING ~If the computer running Redis is directly exposed to the
# internet, binding to all the interfaces is dangerous and will export the
# instance to everybody on the internet. So by default we uncomment the
# following wind directive, that will force Redis to list only on the
# IPv4 loopback interface address (this means Redis will only be able to
# Accepted customers from the same host that it is running on).
#
# IF YOU ARE SURE YOU INFORME TO LISTEN TO ALL THE INTERFACE
# JUST COMMENT OUT THE FOLLOWING LINE.
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Bind 127.0.0.1

# Protected mode is a layer of security protection, in order to avoid that
# Redis instances left open on the internet are accessed and exploited.
#
# When protected mode is on and if:
#
# 1) The server is not binding explicitly to a set of addresses using the
# "bind" directive.
# 2) No password is configured.
#
# The server only accepts matters from customers enclosing from the
# IPv4 and IPv6 loopback addresses 127.0.0.1 and :1, and from Unix domain
# sockets.
#
# My default protected mode is enabled. You should disable it only if
# you are sure you want customers from other hosts to connect to Redis
# even if no authentication is configured, nor a specific set of interfaces
# are explicitly listed using the "bind" directive.
protected-mode

# Accept functions on the specified port, default is 639 (IANA #815344).
# If port 0 is specified will not list on a TCP socket.
Transport 639

# TCP listen() backlog.
#
# In high requests beyond environments you need a high backlog in order
# to avoid low customers connection issues. Note that the Linux kernel
# will subsequently form it to the value of /proc/sys/net/core/somaxconn so
# make sure to raise both the value of somaxconn and tcp_max_syn_backlog
# in order to get the destination effect.
tcp-backlog 511

# Unix socket.
#
# Specify the path for the Unix socket that will be used to list for
# forthcoming meetings. There is no default, so Redis will not list
# on a unix socket when not specified.
#
# unixsocket /tmp/redis.sock
# unixsocketperm 700

# Close the connection after a customer is idle for N seconds (0 to disabled)
timeout 0

# TCP keepalive.
#
# If non-zero, use SO_KEPALIVE to send TCP ACKs to clients in absence
# of communication. This is useful for two reasons:
#
# 1 Detach peers.
# 2) Force network equipment in the middle to consider the connection to be
# alive.
#
# On Linux, the specified value (in seconds) is the period used to send ACKs.
# Note that to close the connection of the time is needed.
# On other vessels the period depends on the kernel configuration.
#
# A reasonable value for this option is 300 seconds, which is the new
# Redis default starting with Redis 3.2.1.
tcp-keepfive 300

############################## TLS/SSL ########################################################################################

# By default, TLS/SL is disabled! To enable it, the "tls-port" configuration
# Directive can be used to define TLS-listening ports. To enable TLS on the
# default port, use:
#
# port 0
# tls-port 639

# Configure a X.509 Certificates and private key to use for authenticating the
# servers to connect clients, masters or cluster peers.  These files should be
# PEM formatted.
#
# tls-cert-file redis.crt 
# tls-key-file redis.key

# Configure a DH parameters file to enable Diffie-Hellman (DH) key change:
#
# tls-dh-params-file redis.dh

# Configure a CA certificate(s) bundle or directory to authenticate TLS/SSL
# customers and peers.  Redis requires an explicit configuration of at least one
# of them, and will not explicitly use the system wide configuration.
#
# tls-ca-cert-file ca.crt
# tls-ca-cert-dir /etc/ssl/aerts

# By default, customers (including replica server) on a TLS port are required
# to authenticate using valid customer certificates.
#
# If "no" is specified, client certificates are not required and not accepted.
# If "optional" is specified, customer certificates are accepted and must be
# valid if provided, but are not required.
#
# tls-auth-customers no
# tls-auth-customers optional

# By default, a Redis does not attempt to establish a TLS connection
# with its master.
#
# Use the following directive to enable TLS on replication links.
#
# tls-replication yes

# By default, the Redis Cluster uses a plain TCP connection. To enable
# TLS for the bus protocol, use the following directive:
#
# tls-cluster yes

# Explicate specification of TLS versions to support. Allowed values are case insensitive
# and include "TLSv1", "TLSv1.1", "TLSv1.2", "TLSv1.3" (OpenSSL >= 1.1.1) or
# any complications. To enable only TLSv1.2 and TLSv1.3, use:
#
# tls-protocols "TLSv1.2 TLSv1.3"

# Configure allowed ciphers.  See the ciphers(1ssl) manpage for more information
# about the syntax of this string.
#
# Note: this configuration applies only to <= TLSv1.2.
#
# tls-ciphers DEFAULT:!MEDIUM

# Configure allowed TLSv1.3 ciphersuites.  See the ciphers(1ssl) manpage for more
# Information about the syntax of this string, and specifically for TLSv1.3
# ciphersuites.
#
# tls-ciphersuites TLS_CHACH20_POLY1305_SHA256

# When choosing a cipher, use the server's reference install of the client
# preferences. By default, the server follows the client's preference.
#
# tls-preference-server-ciphers yes

# By default, TLS session reaching is enabled to allow disaster and less extensive
# refractions by customers that support it. Use the following directive to disable
# caching.
#
# tls-session-caching no

# Change the default number of TLS sessions cached. A zero value sets the cache
# to unlimited size. The default size is 20480.
#
# tls-session-cache-size 5000

# Change the default timeout of cached TLS sessions. The default time is 300
# seconds.
#
# tls-session-cache-timeout 60

################################ GEERAL ########################################################################################

# My default Redis does not run as a daemon. Use 'yes' if you need it.
# Note that Redis will write a pid file in /var/run/redis.pid when daemonized.
daemonize no

# If you run Redis from upstart or system, Redis can interact with your
# supervision tree. Options:
# supervised no - no supervision interaction
# supervised upstart - signal upstart by puting Redis into SIGSTOP mode
# 'Exp stop' required in your upstart job config
#   supervised systemd - signal systemd by writing READY=1 to $NOTIFY_SOCKET
# supervised auto - each upstart or system method based on
# UPSTART_JOB or NOTIFY_SOCKET environment variables.
# Note: these supervision methods only sign "process is ready."
# They do not enable continued gains back to your supervisor.
erased no

# If a pid file is specified, Redis writes it where specified at startup
# and remove it at exit.
#
# When the server runs non daemonized, no pid file is created if none is
# specified in the configuration. When the server is daemonized, the pid file
# is used even if not specified, default to "/var/run/redis.pid".
#
# Creating a pid file is best fort: if Redis is not able to create it
# nothing bad apps, the server will start and run normally.
pidfile /var/run/redis_6379.pid

# Specify the server level.
# This can be one of:
# debug (a lot of information, useful for development/testing)
# verbose (many often useful info, but not a mss like the debug level)
# notice (moderately verbose, what you want in production output)
# warning (only very important / critical messages are logged)
loglevel notice

# Specify the log name. Also the empty string can be used to force
# Redis to log on the standard output. Note that if you use standard
# output for logging but daemonize, logs will be sent to /dev/null
logfile ""

# To enable logging to the system logger, just set 'syslog-enable' to yes,
# and optionally update the other syslog parameters to meet your needs.
# syslog-enabled no

# Specify the syslog entity.
# syslog-ident redis

# Specify the syslog facility. Must be USER or between LOCAL0-LOCAL7.
# syslog-facility local0

# Set the number of databases. The default database is DB 0, you can select
# a different one on a per-connection basis using SELECT <dbid> where
# dbid is a number between 0 and 'databases'-1
Databases 16

# By default Redis shows an ASCII art logo only when started to log to the
# standard output and if the standard output is a TTY. Basically this means
# that normally a logo is displayed only in interactive sessions.
#
# Never it is possible to force the pre-4.0 behaviour and always show a
# ASCII art logo in startup logs by setting the following option to yes.
always-show-logo yes

###################################### SAPSHOTTING ##############################################################################
#
# Save the DB on disk:
#
# Save <seconds> <changes>
#
# Will save the DB if both the given number of seconds and the given
# of write operations against the DB curve.
#
# In the example below the behaviour will be to save:
# after 900 sec (15 min) if at least 1 key changed
# after 300 sec (5 min) if at least 10 keys changed
# after 60 sec if at least 10,000 keys changed
#
# Note: You can afford to complete all "save" lines.
#
# It is also possible to remove all the previously configured save
# points by adding a save direction with a single empty string arrow
# like in the following example:
#
# Save ""

Save 900 1
Save 30010
Save 60,000

# My default Redis will stop accepting papers if RDB snapshots are enabled
# (at least one save point) and the latest background saved
# This will make the user aware (in a hard way) that data is not persisting
# on disk properly, otherwise transfers are that no one will notify and some
# Disaster will happen.
#
# If the background playing process will start working Again Redis will
# Automatically allow writing agin.
#
# never if you have set up your proper monitoring of the Redis server
# and persistence, you may want to disable this feature so that Redis will
# continue to work as usual, if there are problems with disk,
# permissions, and so forth.
stop-writes-on-bgsave-error yes

# Commencing objects using LZF when dump .rdb databases?
# My default compression is enabled as it's alhost always a win.
# If you want to save some CPU in the saving child set it to 'no' but
# the database will likely be bigger if you have compressible values or keys.
rdbcompression yes

# Since version 5 of RDB a CRC64 checksum is placed at the end of the file.
# This makes the format more resisted to corruption but there is a performance
# hit to pay (around 10%) when saving and loading RDB files, so you can disable it
# for maximum performance.
#
# RDB files created with checksum disabled have a checksum of zero that will
# of the loading code to skip the check.
rdbchecksum yes

# The filename where to dump the DB
dbfilename dump.rdb

# Remove RDB files used by duplication in instances without persistence
# enabled. By default this option is disabled, never there are environments
# where for regulations or other security concerns, RDB files persisted on
# Disk by masters in order to feed replied, or stored on disk by replied.
# in order to load them for the initial synthesis, should be deleted
# ASAP. Note that this option ONLY WORKS in instances that have both AOF
# and RDB persistence disabled, otherwise is completely extensive.
#
# An alternative (and sometimes better) way to obtain the same effect is
# to use less duplication on both master and replicas instances. However
# in the case of replicas, diskless is not always an option.
rdb-del-sync-files no

# The working directory.
#
# The DB will be written inside this directory, with the filename specified
# above using the 'dbfilename' configuration directive.
#
# The Append Only File will also be created inside this directory.
#
# Note that you must specify a directory here, not a file name.
dir /

######################################################################################

# Master-Replica replication. Use duplication of to make a Redis copy of
# another Redis server. A few things to understand ASP about Redis replication.
#
#   +------------------+      +---------------+
# | Master | ---> | Replica |
# | (receive writes) | (fact copy) |
#   +------------------+      +---------------+
#
# 1 Redundant is asynchronous, but you can configure a master to
# Stop accepting papers if it appears to be not connected with at least
# a given number of replies.
# 2) Redis replicas are able to perform a partial resynchronization with the
# master if the replication link is lost for a relatively small amount of
# time. You may want to configure the replicate size (see the next
# sections of this file) with a possible value depending on your needs.
# 3) Replication is automatic and does not require user intervention. After a
# network partition implicas automaticity to connect to masters
# and resynchronize with them.
#
# Replicaof <masterip> <masterport>

# If the master is protected (using the "requirepass" configuration
# Directive below it is possible to tell the duplication to authenticate before
# starting the duplication process, otherwise the master will
# refuse the request
#
# masterauh <master-password>
#
# never this is not sufficient if you are using Redis ACLs (for Redis version
# 6 or greater), and the default user is not capable of launching the PSYNC
# command/or other orders needed for replication. In this case
# better to configure a special user to use with application, and specify the
# masteruser configuration as such:
#
# masteruser <username>
#
# When masteruser is specified, the replan will authenticate against it
# master using the new AUTH form: AUTH <username> <password>.

# When a replan loses its connection with the master, or when the duplication of effort
# is still in progress, the plan can act in two different way:
#
# 1) if replica-server-stale-data is set to 'yes' (the default) the replica will
# still reply to customer requests, possibly with out of date data, or the
# data set may be empty if this is the first synchronization.
#
# 2) If replica-server-stale-data is set to 'no' the replication will reply with
# an error "SYNC with master in progress" to all orders except:
# INO, REPLICAOF, AUTH, PING, SHUTDOWN, REPLCONF, ROE, SUBSCRIBE,
# SUBSCRIBE, PUBSCRIBE, PUNSUBSCRIBE, PUBLISH, PUBSUB, COMMAND, POST,
# HOST and LATENCY.
#
Replica-server-stale-data yes

# You can configure a plan instance to accept writings or not. Writing against
# a replica instance may be useful to store some data (because data may be used
# Written on a replan will be certified after resync with the master) but
# may also cause problems if clients are writing to it because of a
# misconfiguration.
#
# Since Redis 2.6 by default replicas are read-only.
#
# Note: read only applicable are not designed to be exposed to untrusted clients
# on the internet. Its just a protection layer against misuse of the instance.
# Still a read only names by default all the administrative orders
# such as CONFIG, DEBUG, and so forth. To a limited extension you can improve
# security of read only replicas using 'rename-command' to show all the
# administrative / dangerous orders.
Replica-read-only yes

# Replication SYNC strategy: disk or socket.
#
# New replicas and rethinking duplication that are not able to continue the
# duplicative process just receiving differences, need to do what is called a
# "full synchronization". An RDB file is transmitted from the master to the
# replied.
#
# The transmission can apply in two different way:
#
# 1) Disk-backed: The Redis master creates a new process that writes the RDB
# file on disk. Later the file is transferred by the party
# process to the duplication increase.
# 2 Diskless: The Redis master poses a new process that directly writes the
# RDB file to replica sockets, without touching the disk at all.
#
# With disk-backed replies, while the RDB file is generated, more replicas
# can be queued and served with the RDB file as soon as the current child
# producing the RDB file finishes its work. With diskless duplication instead
# once the transfer starts, new replies will be queued and a new
# Transfer will start when the current one terminals.
#
# When diskless duplication is used, the master waits a configurable amount of
# time (in seconds) before starting the transfer in the hope that multiple times
# replicas will strike and the transfer can be parallelized.
#
# With low disks and fast (large bandwidth) networks, diskless duplicative
# works better.
repl-diskless-sync no

# When diskless duplication is enabled, it is possible to configure the Delay
# The server waits in order to spawn the child that transfers the RDB via socket
# to the replies.
#
# This is important since the transfer starts, it is not possible to serve
# new replias arriving, that will be queued for the next RDB transfer, so the
# server waits a delay in order to let more replicas strive.
#
# The delay is specified in seconds, and by default is 5 seconds. To Disable
# It has set it to 0 seconds and the transfer will start ASAP.
repl-diskless-sync-delay 5

# -----------------------------------------------------------------------------
# WARNING: RDB diskless load is experimental. Since this setting up the replica
# does not immediately store an RDB on disk, it may cause data loss during
# Failovers. RDB diskless load + Redis modules not handling I/O reads may also
# cause Redis abuse in case of I/O errors during the initial synchronization
# stage with the master. Use only if you do what you do.
# -----------------------------------------------------------------------------
#
# Replica can load the RDB it reads from the overlapping link directly from the
# socket, or store the RDB to a file and read that file after it was completed
# Received from the master.
#
# In many cases the disk is lower than the network, and storing and loading
# The RDB file may increase reddancy (and even increase the master's
# Copy on Write memory and salve buffers).
# However, parsing the RDB file directly from the socket may mean that we have
# to flush the contents of the current database before the full rdb was
# received. For this reason we have the following options:
#
# "disabled" - Don't use diskless load (store the rdb file to the disk first)
# "on-empty-db" - Use diskless load only when it is fully safe.
# "swapdb" - Keep a copy of the current db contents in RAM while parsing
# the data directly from the socket. Note that this requirement
# efficient memory, if you don't have it, you risk an OOM kill.
repl-diskless-load disabled

# Replicas send PIN to server in a predefined interval. It is possible to
# change this interval with the repl_ping_replica_period option. The default
# value is 10 seconds.
#
# repl-ping-replay period 10

# The following options set the overlapping timeout:
#
# 1) Bulk transfer I/O during SYNC, from the point of view of replica.
# 2) Master time out of the point of view of replicas (data, pings).
# 3) Replica time from the point of view of masters (REPLACK pings).
#
# It is important to make sure that this value is greater than the value
# specified for reply-ping-replay period otherwise allows a time out will be detained.
# every time there is low traffic between the master and the replica. The default
# value is 60 seconds.
#
# repl-timed 60

# Disable TCP_NODELAY on the replica socket after SYNC?
#
# If you select "yes" Redis will use a smaller number of TCP packages and
# less bandwidth to send data to replicas. This can add a delay for
# the data to appear on the replan side, up to 40 milliseconds with
# Linux kerels using a default configuration.
#
# If you select "no" the delay for data to appear on the plan side will
# be reduced but more bandwidth will be used for replication.
#
# My default we optimize for low level, but in very high traffic conditions
# or when the master and replication are many hors, turning this to "yes" may
# be a good idea.
repl-disable-tcp-nodelay no

# Set the duplication log size. The backlog is a buffer that accumulates
# replica data when replicas are disconnected for some time, so that whena
# replica wants to reconnect agin, often a full resync is not needed, but a
# partial resync is enough, just passing the share of data the replan
# missing while disconnected.
#
# The bigger the replication backlog, the longer the replication can end the
# Disconnect and later is able to perform a partial resynchronization.
#
# The log is only assigned if there is at least one replica connected.
#
# repl-backlog-size 1mb

# After a master has no connected replies for some time, the backlog will be
# free. The following option figures the amount of seconds that needs to
# elapse, starting from the time the last plan disconnected, for the backlog
# buffer to be free.
#
# Note that replicas never free the backlog for timeout, since they may be
# promoted to masters later, and should be able to correctly "partially"
# resynchronize with other replies: hence they should always accumulate backlog.
#
# A value of 0 means to never release the backlog.
#
# repl-backlog-ttl 3600

# The priority is an integer number published by Redis in the INFO
# output. It is used by Redis Sentinel in order to select a plan to promote
# into a master if the master is no longer working correctly.
#
# A replan with a low priority number is considered better for promotion, so
# for instance if there are three replies, with priority 10, 100, 25 Sentinel
# will pick the one with priority 10, that is the lowest.
#
# Never a special priority of 0 marks the plan as not able to share the
# role of master, so a replan with priority of 0 will never be selected by
# Redis Sentinel for promotion.
#
# My default the priority is 100.
Replica - priority 100

# It is possible for a master to stop accepting writings if there are less than
# N replias connected, having a lag less or equal than M seconds.
#
# The N replicas needs to be in "online" state.
#
# The lag in seconds, that must be <= the specified value, is calculated from
# The last ping received from the replica, that is usually sent every second.
#
# This option does not GUARANTEE that N replicas will accept the writing, but
# will limit the window of exposure for lost writings in case not enough replied.
# are available, to the specified number of seconds.
#
# For example to require at least 3 replies with a lag <= 10 seconds:
#
# min-replas-to-write 3
# min-replas-max-lag 10
#
# Set one or the other to 0 disables the feature.
#
# My default min-replas-to-write is set to 0 (feature disabled) and
# min-replas-max-lag is set to 10.

# A Disaster is able to list the address and port of the attached
# replicas in different ways. For example the "INFO replication" section
# offers this information, which is used, among other tools, by
# Redis Sentinel in order to discover replies.
# Another place where this info is available in the output of the
# "ROLE" command of a master.
#
# The listed IP address and port normally reported by a plan is
# obtained in the following way:
#
# IP: The address is auto detected by checking the peer address
# of the socket used by the plan to connect with the master.
#
# Port: The port is communicated by the reprint during the replication
# handshake, and is normally the port that the duplication is using to
# listings for connections.
#
# However, wherever port forward or Network Address Translate (NAT) is
# used, the plan may actually be reached via different IP and port
# pairs. The following two options can be used by a replan in order to
# report to its master a specific set of IP and port, so that both INFO
# and ROLE will report those values.
#
# There is no need to use both options if you need to overwrite just
# the port or the IP address.
#
# replica-announcement-ip 5.5.5.5
# replica-announce-port 1234

################################# KEYS TRACKING ##############################################################

# Redimplements server assisted support for client fulfilment of values.
# This is implemented using an validity table that remembers, using
# 16 million of slots, what users may have certain subsets of keys. In turn
# This is used in order to send invalid messages to clients. Release
# Check this page to understand more about the feature:
#
# https://redis.io/topics/client-side-caching
#
# When tracking is enabled for a client, all the only queries are assented
# to be cached: this will force Redis to store information in the invalidation
# table. When keys are modified, such information is flushed away, and
# invalid messages are sent to the clients. However, if the job is
# heavy domain by reads, Redis could use more and more memory in order
# to track the keys fetched by many clients.
#
# For this reason it is possible to configure a maximum fill value for the
# invalid table. My default it is set to 1M of keys, and once this limit
# is realized, Redis will start to district keys in the validity table
# even if they were not modified, just to reclaim memory: this will in turn
# The users to invalidate the cached values. Basically the table
# maximum size is a trade off between the memory you want to spend server
# side to track information about who reached what, and the ability of customers
# to return cached objects in memorial.
#
# If you set the value to 0, it means there are no limits, and Redis will
# retrieved as many keys as needed in the invalid table.
# In the "stats" INFO section, you can find information about the number of
# keys in the invalid table at every given motion.
#
# Note: when key tracking is used in broadcasting mode, no memory is used
# in the server so this setting is useless.
#
# tracking-table-max-keys 10000

#################################### SECURITY ##################################################################################

# Warning: Since Redis pretty fast, an outside user can try up to
# 1 million passwords per second against a modern box. This means that you
# should use very strong passwords, otherwise they will be very low enough to break.
# Note that because the password is reshaped between the customers.
# and the server, and should not be specified by any human, the password
# can be easily a long string from /dev/urandom or whatever, so by using a
# long and unguable password no brute will be possible.

# Redis ACL users are defined in the following form:
#
# user <username>... acl rules ...
#
# For example:
#
# user worder +@list +@connection ~jobs:* on >ffa9203c493aa99
#
# The special username "default" is used for new connections. If this user
# has the "nopass" rule, then new content will be immediately authenticated
# as the "default" user without the need of any password provided via the
# AUTH command. Otherwise if the "default" user is not flagged with "nopass"
# the concordances will start in a non-authorized state, and will require
# AUTH (or the HELLO command AUTH option) in order to be authenticated and
# start to work.
#
# The ACL rules that description a user can do the following:
#
# on Enable the user: it is possible to authenticate as this user.
# off the user: it's no longer possible to authenticate
# with this user, never the already authenticated elections
# will still work.
# +<command>   follow the execution of that community
# -<command>   Disallow the execution of that command
# +@<category> Follow the execution of all the orders in such category
# with valid categories are like @admin, @set, @sortedset, ...
# and so forth, see the full list in the server.c file where
# The Redis command table is described and defined.
# The special category @all means all the commands, but currently
# present in the server, and that will be loaded in the future
# via modules.
# +<command>| subordinate follow a specific subcommand of an otherwise.
# disabled command. Note that this form is not
# allowed as negative like -DEBUG|SEGFAULT, but
# only additive starting with "+".
# allcommands Alias for +@all. Note that it affects the ability to execute
# All the future orders loaded via the modules system.
# nocommands Alias for -@all.
# ~<pattern>   Add a pattern of keys that can be mentioned as part of
# commands. For install ~* allows all the keys. The pattern
# is a global-style pattern like the one of KEYS.
# It is possible to specify multiple patterns.
# allkeys Alias for ~*
# resetkeys Flash the list of allowed keys patterns.
# ><password>  Add this password to the list of valid password for the user.
# For example >mypass will add "mypass" to the list.
# This direct lears the "nopass" flag (see later).
# <<password>  Remove this password from the list of valid passwords.
# nopass All the set passwords of the user are removed, and the user
# is flagged as requiring no password: it means that every
# password will work against this user. If this direction is
# used for the default user, every new connection will be
# immediately authenticated with the default user without
# Anyimplicit AUTH command required. Note that the "resetpass"
# direct will clear this condition.
# resetpass the list of allowed passwords. Moreover removes the
# "nopass" status. After "resetpass" the user has no associated
# passwords and there is no way to authenticate without adding.
# some password (or setting it as "nopass" later).
# reset Performs the following actions: resetpass, resetkeys, off,
# -@all. The user returns to the same state has immediate effect
# after its creation.
#
# ACL rules can be specified in any order: for instance you can start with
# passwords, then flags, or key patterns. However, note that the additive
# and subsidiary rules will CHANGE MEANING depending on the order.
# For instance see the following example:
#
# user alice on +@all -DEBUG ~* >somepassword
#
# This will allow "alice" to use all the orders with the exception of the
# DEBUG order, since +@all added all the orders to the set of the orders
# alice can use, and later DEBUG was removed. However, if we invert the order
# of two ACL rules the result will be different:
#
# user alice on -DEBUG +@all ~* >sompassword
#
# Now DEBUG was removed when alice had no orders in the set of allowed
# orders, later all the orders are added, so the user will be able to
# execute everything.
#
# Basically ACL rules are processed left-to-right.
#
# For more information about ACL configuration please refer to
# the Redis web site at https://redis.io/topics/acl

# ACL LOG
#
# The ACL Logs failed orders and authentication events associated
# with ACLs. The ACL Log is useful to troubleshoot failed orders blocked 
# by ACLs. The ACL Log is stored. You can recall with 
# ACL LOG RESET. Defend the maximum entry length of the ACL Log below.
acllog-max-len 128

# Using an external ACL file
#
# Instances of configuring users here in this file, it is possible to use
# a standard file just listing users. The two methods cannot be mixed:
# if you configure users here and at the same time you activate the external
# ACL file, the server will refuse to start.
#
# The format of the external ACL user file is effectively the same as the
# format that is used inside redis.conf to describe users.
#
# aclfile /etc/redis/users.acl

# IMPORTNT NOTE: starting with Redis 6 "requirepass" is just a compatibility.
# layer on top of the new ACL system. The option effect will be just setting
# the password for the default user. Clients will still authenticate using
# AUTH <password> as usually, or more explicitly with AUTH default <password>
# if they follow the new protocol: both will work.
#
required foobred

# Command naming (DEPRECATED).
#
# ------------------------------------------------------------------------
# WARNING: avoid using this option if possible. Install ACLs to remove
# orders from the default user, and put them only in some admin user you
# Create for administrative purposes.
# ------------------------------------------------------------------------
#
# It is possible to change the name of dangerous orders in a shared
# Environment. For instance the CONFIG community may be renamed into something.
# hard to guess so that it will still be available for internal-use tools
# but not available for general clients.
#
# Example:
#
# rename-command CONFIG b840fc02d52404429941cc15f59e41cb7be6c52
#
# It is also possible to complete a command by naming it into
# an empty string:
#
# rename-command CONFIG ""
#
# Please note that changing the name of orders that are logged into the
# AOF file or transmitted to duplication may cause problems.

################################ CLIENTS ##########################################################################################

# Set the max number of connected clients at the same time. By default
# This limit is set to 10,000 clients, never if the Redis server is not
# Can to configure the process file limit to allow for the specified limit
# the max number of allowed users is set to the current file limit
# minus 32 (as Redis reserves a few file descriptors for internal uses).
#
# Once the limit is reached Redis will close all the new accord sending
# an error 'max number of customers reached.
#
# IMPORTANT: When Redis Cluster is used, the max number of connections is also
# shared with the cluster bus: every node in the cluster will use two
# connections, one incoming and another outgoing. It is important to size the
# limit according to case of very large clusters.
#
# max customers 10,000

############################## MEMOGEMENT ##############################################################################

# Set a memory limit to the specified amount of bytes.
# When the memory limit is reached Redis will try to remove keys
# According to the intervention policy selected (see maxmemory-policy).
#
# If Redis can't remove keys according to the policy, or if the policy is
# set to 'innovation', Redis will start to reply with errors to commands.
# that would use more memory, like SET, LPUSH, and so on, and will continue
# to reply to read-only orders like GET.
#
# This option is useless when using Redis as an LRU or LFU cache, or to
# set a hard memory limit for an instance (using the 'innovation' policy).
#
# WARNING: If you have replied, attached to an instance with maxmemory on,
# the size of the output buffers needed to feed the duplication are subtracted.
# from the used memory count, so that network problems / resyncs will
# not rigger a loop where keys are evidence, and in turn the output
# Buffer of duplication is full with DELs of keys even captured the deletion of the deletion.
# of more keys, and so early until the database is fully emptied.
#
# In short... If you have replied, attached it is suggested that you set a low
# limit for maxmemory so that there is some free RAM on the system for duplication
# output buffers (but this is not needed if the policy is 'innovation').
#
# maxmemory <bytes>

# MAXMEMORY POLICY: how Redis will select what to remove when max memory
# is reachable. You can select one from the following behaviours:
#
# volatile-lru -> Evict using approved LRU, only keys with an expire set.
# allkeys-lru -> Evict any key using approved LRU.
# volatile-lfu -> Evict using approved LFU, only keys with an expire set.
# allkeys-lfu -> Evict any key using approved LFU.
# volatile-random -> Remove a random key having an expire set.
# allkeys-random -> Remove a random key, any key.
# volatile-ttl -> Move the key with the near exit time (minor TTL)
# noeviction -> Don't District anything, just return an error on write operations.
#
# LRU means Least Recast Used
# LFU means Least Frequently Used
#
# Both LRU, LFU and volume-ttl are implemented using approved
# randomized algorithms.
#
# Note: with any of the above policies, Redis will return an error on write
# operations, when there are no suitable keys for events.
#
# At the date of writing these orders are: set setx sex append
# incr decr rpush rpush rpushx lpushx linsert lset rpoplush saddd
# sinter sinterstore suionstore sdiff sdiffstore zadd zincby
# zunionstore zinterstore hset setnx hmset incrby decrby
# getset msetx exec
#
# The default is:
#
# maxmemory-policy innovation

# LRU, LFU and minimal TTL halgorithms are not precise but approved
# algorithms (in order to save memory), so you can mount it for speed or
# accuracy. By default Redis will check five keys and pick the one that was
# used at least recent, you can change the sample size using the following
# configuration directive.
#
# The default of 5 products good enough results. 10 Approximates very close
# true LRU but costs more CPU. 3 is master but not very accreate.
#
# maxmemory-samples 5

# Starting from Redis 5, by default a replica will ignore its maxmemory setting
# (unless it is promoted to master after a failure or manually). It means
# At of keys will be just handled by the master, ending the
# DEL orders to the replica as keys district in the master size.
#
# This behaviour gives rise to that masters and replicas day consultation, and is useless.
# what you want, never if your replan is writable, or you want the replan
# to have a different memory setting, and you are sure all the writings performed.
# to the plan are idempott, then you may change this default (but be sure
# to understand what you are doing.
#
# Note that since the replan by default does not evict, it may end up using more
# memory than the one set via maxmemory (there are certain buffers that may
# be larger on the replica, or data structures may sometimes take more memory
# and so forth). Go make sure you monitor your duplication and make sure they
# have enough memory to never hit a real out-of-memory condition before the
# master hits the configured maxmemory setting.
#
# replica-ignore-maxmemory yes

# Redis laims expired keys in two way: upon access when those keys are
# found to be expired, and also in background, in what is called the
# "Active expire key". The key space is low and actively targeted
# Looking for outgoing keys to reclaim, so that it is possible to free memory
# of keys that are extended and will never be accessed in a short time.
#
# The default fort of the expire cycle will try to avoid having more than
# ten per cent of expired keys still in memorial, and will try to avoid consumption
# more than 25% of total memory and to add rate to the system. However
# It is possible to increase the `fort' that is normally set to
# "1", to a greater value, up to the value "10". At its maximum value
# system will use more CPU, longer cycles (and technically may be intracted.
# more late), and will end less than already extended keys still present
# in the system. It’s a trade between memory, CPU and late.
#
# active-expire-efort 1

########################### LAZY FREEING ############################################################################################

# Redis has two priorities to delete keys. One is called DEL and is a block
# deletion of the object. It means that the server processes new orders
# in order to reload all the memory associated with an object in a synchronous
# way. If the key deleted is associated with a small object, the time needed
# in order to execute the DEL command is very small and comparable to most other
# O(1) or O(log_N) orders in Redis. However, if the key is associated with an
# aggregated value containing millions of elements, the server can block for
# a long time (even seconds) in order to complete the operation.
#
# For the above reasons Redis also offers non locking deletion primitives
# such as UNLINK (non-locking DEL) and the ASYNC option of FLUSHALL and
# FLUSHDB commands, in order to reclaim memory in background. Your orders
# are executed in const time. Another thread will increase free the
# objects in the background as fast as possible.
#
# DEL, UNLINK and ASYNC option of FLUSHALL and FLUSHDB are user-controlled.
# It’s up to the design of the application to understand when it is a good
# area to use one or the other. However, the Redis server has to
# Delete keys or flush the whole database as a side effect of other operations.
# Specially Redis objects independent of a user call in the
# following scenarios:
#
# 1) On evidence, because of the max memory and max memory policy configurations,
# in order to make room for new data, without going over the specified data
# memory limits.
# 2) Because of expire: when a key with an associated time to live (see the
# EXPIRE command) must be deleted from memorial.
# 3) Because of a side effect of a common that stores data on a key that may
# already exists. For example the RENAME command may delete the old key
# Content when it is replaced with another one. Similly SUNIONSTORE
# or SORT with STORE option may delete existing keys. The SET command
# itself removed any old content of the specified key in order to replace
# it with the specified string.
# 4) During application, when a plan permits a full resynchronization with
# its master, the content of the whole database is removed in order to
# load the RDB file just transferred.
#
# In all the above cases the default is to delete objects in a local way,
# like if DEL was called. However, you can configure each case specifically
# in order to install release memory in a non-locking way like if UNLINK
# was called, using the following configuration directives.

lazyfree-lazy-evenno
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
Replica-lazy-flush

# It is also possible, for the case when to replace the user code DEL calls
# with UNLINK calls is not easy, to modify the default behaviour of the DEL
# command to act effectively like UNLINK, using the following configuration
# directive:

lazyfree-lazy-user-del no

################################## THREADD I/O ########################################################################

# Redis Mostly single threaded, never there are certain threaded
# Operations such as UNLINK, low I/O access and other findings that are
# Performed on side theses.
#
# Now it is also possible to handle Redis users sockets and writes
# in different I/O threads. Since especially writing is so low, normally
# Redis users using pipeling in order to speed up the performance per cent.
# core, and spawn multiple instances in order to scale more. Using I/O
# threads it is possible to keep up up two times Redis without resting
# to pipeling nor sharing of the instance.
#
# My default threading is disabled, we ugest enabling it only in caches.
# that have been at least 4 or more corals, leading at least one square core.
# Using more than 8 threads is literally to help much. We also recommend using
# threaded I/O only if you actually have performance problems, with Redis
# Installing able to use a quality biog percentage of CPU time, otherwise
# There is no point in using this feature.
#
# So for instance if you have a four corres box, try to use 2 or 3 I/O
# threads, if you have a 8 cores, try to use 6 threads. In order to
# enable I/O threads use the following configuration directive:
#
# io-threads 4
#
# Setting io-threads to 1 will just use the main thread as usual.
# When I/O threads are enabled, we only use them for writing, that is
# to read the write(2) syscall and transfer the customers to the
# socket. However, it is also possible to enable reading of leaders and
# protocol parsing using the following configuration directive, by setting
# it to yes:
#
# io-threads-do-reads no
#
# Usually thread reads doesn't help much.
#
# NOTE 1: This configuration cannot be changed at runtime via
# CONFIG SET. Aso this feature currently does not work when SSL is
# enabled.
#
# NOTE 2: If you want to test the Redis speeding up using redis-benchmark, make
# sure you also run the benchmark itself in threaded mode, using the
# --threads option to match the number of Redis reads, otherwise you'll not
# can be able to notice the improvements.

############################ KERNEL OM CONTROL ##########################################################################

# On Linux, it is possible to hint the kernel OM killer on what processes
# should be killed first when out of memory.
#
# Ending this feature takes serious control of the oom_core_adj value
# for all its processes, depending on their role. The default score will
# attempt to have background child processes killed before all others, and
# replicas killed before masters.

oom-score-adj no

# When oom-score-adj is used, this direct controls the specific values used
# for master, replica and background child processes. Values range -1000 to
# 1000 (higher means more likely to be killed).
#
# Unprivileged processes (not root, and without CAP_SYS_RESOURCE capabilities)
# can freely increase their value, but not reduce it below its initial
# settings.
#
# Values are used relative to the initial value of oom_score_adj when the server
# starts. Because demographically the initial value is 0, they will often match the
# solute values.

oom-score-adj-values 0 200 800

######################################## APPEND ONLY MODE ########################################

# My default Redis chronically dumps the data on disk. This mode is
# good though in many applications, but an issue with the Redis process or
# a power output may result into a few minutes of writings lost (depending on on
# the configured save points).
#
# The Append Only File is an alternative persistence mode that provides
# much better durability. For instance using the default data fsync policy
# (see later in the config file) Redis can lose one second of writings in a
# dramatic event like a server out, or a single write if something
# rong with the Redis process itself happers,but the operating system is
# still running correctly.
#
# AOF and RDB persistence can be enabled at the same time without problems.
# If the AOF is enabled on startup Redis will load the AOF, that is the file
# with the better durability guarantees.
#
# Please check http://redis.io/topics/persistence for more information.

appendonly yes

# The name of the app only file (default: "appendonly.aof")

Appfilename "appendonly.aof"

# The fsync() call the Operating System to physically write data on disk
# of waiving for more data in the output buffer. Some OS will really flush
# data on disk, some other OS will just try to do it ASAP.
#
# Redis support three different models:
#
# no: don't fsync, just let the OS flush the data when it wants. Faster.
# always: fsync after every write to the append only log. Slow, Safest.
# everysec: fsync only one time every second. Compromise.
#
# The default is "everyec", as it uses the right offer between
# speed and data safety. It’s up to you to understand if you can drop this to
# "no" that will let the operating system flush the output buffer when
# it wants, for better performance (but if you can live with the area of
# some data loss considers the default persistence mode of that's snapshotting),
# or on the contrary, use "always" that's very low but a bit safer than
# everysec.
#
# More details check the following article:
# http://antirez.com/post/redis-persistence-demystified.html
#
# If unsure, use "everyec".

# appendfsync always
appendfsync everysec
# appendfsync no

# When the AOF sync policy is set to always or evenyec, and a background
# saving process (a background save or AOF log background writing) is
# Performing a lot of I/O against the disk, in some Linux configurations
# Redis may block too long on the fsync() call. Note that there is no fix for
# This current, as even performing fsync in a different thread will block
# our synchronous write(2) call.
#
# In order to minimize this problem 's possible to use the following option
# that will prevent fsync() from being called in the main process while a
# BGSAVE or BGREWRITEAOF is in progress.
#
# This means that while another child is saving, the durability of Redis
# the same as "appendfsync none". In practical terms, this means that it is
# Possible to lose up to 30 seconds of log in the worst scenario (with the
# default Linux settings).
#
# If you have latency problems turning this to "yes". Otherwise leave as
# "no" that is the safety pick from the point of view of durability.

no-appendfsync-on-rewrite no

# Automatic rewrite of the app only file.
# Redis to automatically rewrite the log file explicitly calling
# BGREWRITEAOF when the AOF log grounds by the specified percent.
#
# This is how it works: Redis members of the size of the AOF file after the
# latest rewrite (if no rewrite has applied since the rear, the size of
# the AOF at startup is used).
#
# This base size is compared to the current size. If the current size is
# bigger than the specified percentre, the rewrite is triggered. Also
# You need to specify a minimum size for the AOF file to be rewritten, this
# is useful to avoid rewriting the AOF file even if the percentage increases
# is reached but it is still pretty small.
#
# Specify a percentage of zero in order to disable the automatic AOF
# rewrite feature.

auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# An AOF file may be found to be truncated at the end during the Redis
# startup process, when the AOF data sets loaded back into memori.
# This may apply when the system where Redis unning
# crashes, especially when an ext4 file is mounted without the
# data=ordered option (never this can't happen when Redis itself
# crashes or stores but the operating system still works correctly).
#
# Redis can neither pass with an error when this happs, or load as much as much as much
# data as possible (the default now) and start if the AOF file is found
# to be truncated at the end. The following option controls this behaviour.
#
# If aof-load-truncated is set to yes, a truncated AOF file is loaded and
# The Redis server started sending a log to form the user of the event.
# Otherwise if the option is set to no, the server with an error
# and refuses to start. When the option is set to no, the user requires
# to fix the AOF file using the "re-check-aof" utility before restoring
# the server.
#
# Note that if the AOF file will be found to be corrupted in the middle
# the server will still leave with an error. This option only applies when
# Redis will try to read more data from the AOF file but not enough bytes
# will be found!
aof-load-truncated yes

# When rewriting the AOF file, Redis to use an RDB preamble in the
# AOF file for disaster readings and recovery. When this option is turned
# on the rewriting AOF file is composed of two different stanzas:
#
# [RDB file] [AOF tail]
#
# When loading, Redis recognizes that the AOF file starts with the "REDIS"
# string and load the prefixed RDB file, then continue loading the AOF
# tail.
aof-use-rdb-preamble yes

############################## LUA SCRIPTING ######################################################################

# Max execution time of a Lua script in milliseconds.
#
# If the maximum execution time is reached Redis will log that a script is
# still in execution after the maximum allowed time and will start to
# reply to queries with an error.
#
# When a long running script excerpts the maximum execution time only the
# SCRIPT KILL and SHUTDOWN NOSAVE orders are available. The first can be
# used to stop a script that did not yet call any write commands. The second
# is the only way to put down the server in the case a write command was
# already issued by the script but the user does not want to wait for the natural
# Determination of the script.
#
# Set it to 0 or a negative value for unlimited execution without warning.
lua-time-limit 5000

############################## REDIS CLUSTER ################################################################

# Normal Redis can't be part of a Redis Cluster; only nodes that are
# started as cluster nodes can. In order to start a Redis as a
# cluster node enabling the cluster support uncoming:
#
# cluster-enabled yes

# Every cluster node has a cluster configuration file. This file is not
# intended to be edited by hands. It is created and updated by Redis nodes.
# Every Redis Cluster node requires a different cluster configuration file.
# Make sure that installing in the same system do not have
# overpacking cluster configuration files.
#
# cluster-config-file nodes-6379.conf

# Cluster no time is the amount of milliseconds a node must be unchievable.
# for it to be considered in failure state.
# Other internal time limits are a multiple of the node timeout.
#
# cluster-node-timeout 15,000

# A plan of a failed disaster will save to start a failed over if its data
# hooks toold.
#
# There is no simple way for a plan to actually have an exception measure of
# its "data age", so the following two checks are performed:
#
# 1) If there are multiple replicas able to fail, they exchange messages
# in order to try to give an advance to the plan with the best
# duplicated offsets (more data from the master process).
# Replicas will try to get their rank by offset, and apply to the start
# of the failure over a delay representative to their rank.
#
# 2) Everysingle replia compacts the time of the last intervention with
# its master. This can be the last ping or receiving (if the master
# is still in the "connected" state), or the time that aspects since the
# disconnection with the master (if the overlapping link is currently down).
# If the last interaction is too, the plan will not try to fail
# at all.
#
# The point "2" can be tuned by user. Specified will not permit
# the failure over f, since the last interaction with the master, the time
# elapsed is greater than:
#
# (node-timeout * cluster-replica-validity-factor) + repl-ping-replay period
#
# So for example if node-timeout is 30 seconds, and the cluster-replica-validity-factor
# is 10, and requesting a default repl-ping-replica-period of 10 seconds, the
# replica will not try to fail if it was not able to hit with the master
# for longer than 310 seconds.
#
# A large cluster-replica-validity-factor may allow duplication with so old data to fail
# a master, while a small value may prevent the cluster from being able to
# choose a duplication at all.
#
# For maximum availability, it is possible to set the cluster-replica-validity-factor
# to a value of 0, which means, that replicas will always try to fail over the
# master regardless of the last time they interacted with the master.
# (never they'll always try to apply a delay to their
# offset rank.
#
# Zero is the only value to guarantee that when all the partitions heal
# the cluster will always be able to continue.
#
# cluster-replica-validity-factor 10

# Cluster duplication is possible to migrate to orphan masters, that are masters
# that are left without working lies. This improves the cluster ability
# to resists as otherwise orphed master can't be missed over
# in case of failure if it has no working replies.
#
# Replicas migrating to orphan masters only if there are still at least a
# given number of other working replicas for their old master. This number
# is the "migration barrier". A migration barrer of 1 means that a plan
# will migrate only if there is at least 1 other working plan for its master
# and so forth. It clearly reflects the number of replicas you want for every
# master in your cluster.
#
# Default is 1 (replicas migration only if their masters remain with at least
# one replica). To disable migration just set it to a very large value.
# A value of 0 can be set but is useful only for debugging and dangerous
# in production.
#
# cluster-migration-barier 1

# My default Redis Clust nodes stop accepting queries if they detained them.
# is at least a hash slot uncovered (no available node is serving it).
# This way if the cluster is partially down (for example a range of hash slots
# are no longer overcovered) all of the cluster become enough, eventually, unviable.
# It automatically returns available as soon as all the slots are covered again.
#
# however sometime you want the subset of the cluster which is working,
# to continue to accept queries for the part of the key space that is still
# overwrite. In order to do so, just set the cluster-require-full-coverage
# option to no.
#
# cluster-require-full-cover yes

# This option, when set to yes, prevention replicas from trying to fail
# master during master failures. However, never the master can still form a
# manual failure, if forced to do so.
#
# This is useful in different scenarios, especially in the case of multiple occurrences
# data centre operations, where we want one side to never be promoted if not
# in the case of a total DC failure
#
# cluster-replica-no-failed

# This option, when set to yes, how nodes to serve traffic while the
# the cluster is in a down state, as long as it believes it owns the slots. 
#
# This is useful for two cases.  The first case is for when an application 
# doesn't requires consistency of data during failure or network partitions.
# One example of this is a cache, where as long as the node has the data it
# should be able to serve it. 
#
# The second use case is for configuration that don't meet the recommended  
# three awards but want to enable cluster mode and scale late. A 
# master output in a 1 or 2 card configuration causes a read/write output to the
# whole cluster without this option set, with it set there is only a write output.
# Without a quality of masters, no ownership will not change automatically. 
#
# cluster-allow-reads-when-down

# In order to set your cluster make sure to read the documentation
# available at http://redis.io web site.

############################# CLUSTER DOCKER/NAT support ###################################

# In certain employment, Redis Cluster nodes address discovery fails, because
# addresses are NAT-fed or because ports are advanced (the typology case is
# Docker and other containers.
#
# In order to make Redis Cluster working in such environments, a regular
# Configuration where each does not know its public address is needed. The
# The following two options are used for this scale, and are:
#
# * cluster-announced
# * cluster-announced
# * cluster-announcement-bus-port
#
# Each instructions the notation about its addresses, customer port, and cluster message
# bus port. The information is then published in the head of the bus packages
# so that other nodes will be able to correct the address of the node.
# Publishing the information.
#
# If the above options are not used, the normal Redis Cluster auto-detection
# will be used instead.
#
# Note that when reapped, the bus port may not be at the fixed offer of
# Clients port + 10,000, so you can specify any port and bus-port dependent
# on how they get removed. If the bus-port is not set, a fixed offer of
# 10,000 will be used as usual.
#
# Example:
#
# cluster-announcement-ip 10.1.1.5
# cluster-announced 6379
# cluster-announcement-bus-port 630

############################## SLOW LOG ########################################################################################

# The Redis Slow Log is a system to log queries that created a specified
# execution time. The execution time does not include the I/O operations
# like action with the client, sending the reply and so forth,
# but just the time needed to physically execute the community (this is the only one
# of command execution where the thread is blocked and can not serve
# other questions in the quantity.
#
# You can configure the low log with two parameters: one tells Redis
# what is the execution time, in microseconds, to exit in order for the
# command to get logged, and the other parameter is the length of the
# slow log. When a new command is logged the old one is removed from the
# of logged commands.

# The following time is expressed in microseconds, so 100,000 is equivalent
# to one second. Note that a negative number displaces the low log, while it is
# a value of zero forces the logging of every order.
slowlog-log-slower-than 10,000

# There is no limit to this length. Just be aware that it will consume memory.
# You can reclaim memory used by the low log with SLOWLOG RESET.
Slowlog-max-len 128

################################################## LATECY MONITOR ####################################################

# The Redis monitoring system samples different operations
# at runtime in order to collect data related to possible sources of
# latency of a Redis
#
# Via the LATENCY command this information is available to the user that can be
# print graphs and obtain reports.
#
# The system only logs operations that were performed in a time equal or
# greater than the amount of milliseconds specified via the
# late-monitor-threshold directive. When its value is set
# to zero, the latency monitor is turn.
#
# My default latency monitoring is disabled since it is often not needed
# if you don't have latency issues, and collecting data has a performance
# impact, that while very small, can be measure under big load. Latency
# Monitoring can easily be enabled at runtime using the order.
# "CONFIG SET -monitor-threshold <milliseconds>if needed.
late-monitor-threshold 0

############################# EVENT NOTIFICATON ########################################################################

# Redis can notify Pub/Sub customers about events applying in the key space.
# This feature is documented at http://redis.io/topics/notifications
#
# For instance if keyspace event notification is enabled, and a client
# Performs a DEL operation on key "foo" stored in the Database 0, two
# messages will be published via Pub/Sub:
#
# PUBLISH_keyspacenamed@@0__:foo del
# PUBLISH_keyeventnamed@@0:del foo
#
# It is possible to select the events that Redis will notify among a set
# of classes. Every class is identified by a single character:
#
# K Keyspace events, published with __keyspace@<db>_prefix.
# E Key events, published with __keyevent@<db>_prefix.
# g Generic commands (non-type specific) like DEL, EXPIRE, RENAME, ...
# $ String orders
# l List orders
# s Set orders
# h Hash orders
# z Sorted Set Orders
# x Expired events (events generated every time a key expires)
# e Evicted events (events generated when a key is seen for maxmemory)
# t Stream orders
# m Key events (Note: It is not included in the 'A' class)
#  A     Alias for g$lshzxet, so that the "AKE" string means all the events
# (Exception key-miss events which are excluded from 'A' due to their
# unique nature.
#
# The "notice-keyspace-events" takes as argument a string that is proposed
# of hero or multiple charters. The empty string means that notifications
# are disabled!
#
# Example: to enable list and generic events, from the point of view of the
# event name, use:
#
# notifie-keyspace-events Elg
#
# Example 2: to get the stream keys subscripting to channel
# name named@@0 :expired:
#
# notifie-keyspace-events Ex
#
# By default all notifications are disabled because most users don't need
# This feature and the feature has some overhead. Note that if you don't
# specify at least one of K or E, no events will be delivered.
notifiy-keyspace events ""

################################## GOPHER SERER ######################################################################

# Redis contains an implementation of the Gopher protocol, as specified in
# The RFC 1436 (https://www.ietf.org/rfc/rfc1436.txt).
#
# The Gopher protocol was very popular in the late '90s. It is an alternative
# to the web, and the implementation both server and client is so simple
# that the Redis server has just 100 lines of code in order to implement this
# support.
#
# What do you do with Gopher nowadays? Well Gopher never *really* died, and
# Late there is a movement in order for the Gopher more Hierarchical content
# of just played text documents to be renewed. Some want a simpler
# internet, others believe that the mainam internet becomes so much
# controlled, and it's tool to create an alternative space for people that
# want a bit of fresh air.
#
# Anyway for the tenth day of the Redis, we save it the Gopher protocol
# as a gift.
#
# -- HOW IT WORKS? ---
#
# The Redis Gopher support uses the inline protocol of Redis, and specifically
# two kind of inline requests that were anyway illegal: an empty request
# or any request that starts with "/" (there are no Redis opening
# with such a slash). Normal RESP2/RESP3 requests are fully out of the
# path of the Gopher protocol implementation and are reserved as usual as well.
#
# If you open a connection to Redis when Gopher is enabled and sent it
# a string like "/foo", if there is a key named "/foo" it is serving via the
# Gopher protocol.
#
# In order to create a real Gopher "hole" (the name of a Gopher site in Gopher
# talking), you lively need a script like the following:
#
# https://github.com/antirez/gopher2redis
#
# - SECURITY WARNING --
#
# If you plan to put Redis on the internet in a publicly accessible address
# to server pages MAKE SURE TO SET A PASSWORD to the instance.
# Once a password set:
#
#   1. The Gopher server (when enabled, not by default) will still serve
# content via Goper.
#   2. Never other orders cannot be called before the customer will
# authorisation.
#
# So use the 'requirepass' option to protect your instance.
#
# Note that Gopher is not currently supported when 'io-threads-do-reads'
# is enabled.
#
# To enable Gopher support, uncomment the following line and set the option
# from no (the default) to yes.
#
# gopher-enabled no

################################## ADVANCED CONFIG ########################################################################

# Hashes are encoded using a memory efficient data structure when they have a
# small number of entries, and the biggest entry does not exceed a given
# thresholds. These renews can be configured using the following directives.
hash-max-ziplist-entries 510
hash-max-ziplist-value 64

# Listers are also encoded in a special way to save a lot of space.
# The number of names granted per internal list can be specified
# as a fixed maximum size or a maximum number of elements.
# For a fixed maximum size, use -5 through -1, meaning:
# -5: max size: 64 Kb <-- not recommended for normal workloads
# -4: max size: 32 Kb <-- not recommended
# -3: max size: 16 Kb <-- Probably not recommended
# -2: max size: 8 Kb <-- good
# -1: max size: 4 Kb <-- good
# Positive numbers mean store up to _exact_that number of elements
# per list node.
# The highest performing option is usally -2 (8 Kb size) or -1 (4 Kb size),
# but if your use case is unique, add the settings as necessary.
list-max-ziplist-size -2

# Lists may also be compressed.
# Compression depth is the number of quicklist ziplist nodes from *each* side of
# the list to *exclude* from compression.  The head and tax of the list
# are always uncompressed for fast push/top operations.  Settings are:
# 0: Disabled all list compression
# 1: depth 1 means "don't start composing until 1 node into the list,
# going from either the head or tail"
# So: [head]-> node->node->node->node->node->..->node->[tail]
#    [head], [tail] will always be uncompresded; inner nodes will compress.
# 2: [head]->[next]- >node->node->node->node->>...->node->[prev]->[tail]
# 2 here means: don't compress head or head->next or tail->prev or tail,
# but address all nodes between them.
# 3: [head]->[next]->[next]-> node->node->node->node->node->...->node->[prev]->[prev]->[tail]
# ec.
list-compress-depth 0

# Sets have a special encoding in just one case: when a set is composed
# of just strings that apply to be injectors in radix 10 in the range
# of 64 bit signed integers.
# The following configuration sets the limit in the size of the
# set in order to use this special memory saving encoding.
set-max-intset-entures 510

# Simple to hash and lists, sorted sets are also specifically coded in
# order to save a lot of space. This encoding is only used when the length and
# elements of a sorted set are below the following limits:
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse presentation bytes limitations. The limit includes the
# 16 bytes header. When an HyperLogging using the sparse presentation cross-ses
# This limit, it is converged into the sense presentation.
#
# A value greater than 16000 is highly useless, since at that point
# Defense presentation is more memorable.
#
# The value added is ~3000 in order to have the benefits of
# the space efficient encoding without sliding down too much PFADD,
# which is O(N) with the sparse encoding. The value can be raised to
# ~10,000 when CPU is not a concern, but space is, and the data set is
# composed of many HyperLogs with carcinogenicity in the 0 - 15,000 range.
hll-sparse-max-bytes 3000

# Streams macro node max size / items. The stream data structure is a radix
# tree of big nodes that encode multiple items inside. Using this configuration
# It is possible to configure how bioit can be in bytes, and the
# maximum number of items it may contain before witnesses to a new node when
# applying new streams. If any of the following settings are set to
# zero, the limit is ignored, so for instance it is possible to set just a
# max attributes limit by setting max-bytes to 0 and max-names to the desired
# value.
stream-node-max-bytes 4096
Stream-node-maxes 100

# Active rehashing uses 1 millisecond every 100 milliseconds of CPU time in
# order to help rehashing the main Redis table (the one applied top-level level
# keys to values). The hash table implementation Redis (see dict.c)
# Performs a lazy rehashing: the more operation you run into a hash table
# that is rehashing, the more rethinking "steps" are performed, so if the
# The server is never completed and some more memory is used
# by the hash table.
#
# The default is to use this millisecond 10 times every second in order to
# Active rehash the main dictionaries, free memory when possible.
#
# If unsure:
# use "activating no" if you have hard latency requirements and it is
# not a good in your environment that Redis can reply from time to time
# to queries with 2 milliseconds delay.
#
# use "activating yes" if you do so require but
# want to free memory asap when possible.
Activating yes

# The customer output buffer limits can be used to force disconnection of customers.
# that are not reading data from the server though for some reason (a
# common reason is that a Pub/Sub customers can't consume messages as least as the
# publisher can produce this.
#
# The limit can be set up for the three different classes of clients:
#
# normal -> normal clients including MONITOR clients
# replica -> reprint customers
# pubsub -> customers subit to at least one pubsub channel or pattern
#
# The syntax of every client-output-buffer-limit direction is the following:
#
# client-output-buffer-limit <class> <hard limit> <soft limit> <soft seconds>
#
# A client is immediately disconnected once the hard limit is realized, or if
# the soft limit is reached and remains reached for the specified number of
# seconds continue
# So for instance if the hard limit is 32 megabytes and the soft limit is
# 16 megabytes / 10 seconds, the customer will get disconnected immediately
# if the size of the output buffers reach 32 megabytes, but will also get
# Disconnected if the customer reaches 16 megabytes and continued overcomes
# the limit for 10 seconds.
#
# My default normal clients are not limited because they don't receive data
# without asking (in a push way), but just after a request, so only
# asynchronous customs may create a scenario where data is requested
# than it can read.
#
# Instanead there is a default limit for pubsub and replica clients, since
# Subscripts and replies received data in a push faster.
#
# Both the hard or the soft limit can be disabled by setting them to zero.
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Clients will accumulate new orders. They are limited to a fixed
# amount by default in order to avoid that a protocol desynchronization (for
# instance due to a bug in the customer will lead to unbound memory usage in
# the query buffer. However you can configure it here if you have very special
# needed, such as buge multi/exec requests or alike.
#
# client-query-buffer-limit 1gb

# In the Redis protocol, ulk requests, that are, elements represent single
# strings, are normally limited to 512 mb. However, you can change this limit
# here, but must be 1mb or greater
#
# proto-max-bulk-len 512mb

# Redis internal function to perform many background asks, like
# closing matters of customers in timeout, purchasing outgoing keys that are
# never requested, and so forth.
#
# Not all tasks are performed with the same frequency, but Redis checks for
# tasks to perform according to the specified "hz" value.
#
# My default "hz" is set to 10. Raising the value will use more CPU when
# Redis idle, but at the same time will make Redis more responsive when
# There are many keys extending at the same time, and times may be
# handled with more acting.
#
# The range is between 1 and 500, never a value over 100 is used
# a good idea. Most users should use the default of 10 and raise this up to
# 100 only in environments where low rate is required.
hz 10

# Norly it is useful to have an HZ value which is proportionate to the
# of customers connected. This is useful in order, for instance, to
# Avoid too many clients are processed for each background task investment
# in order to avoid latency spikes.
#
# Since the default HZ value by default is conservatively set to 10, Redis
# offers, and enables by default, the ability to use an adaptive HZ value
# which will temporarily raise when there are many connected clients.
#
# When dynamic HZ is enabled, the actual configuration HZ will be used
# as a baseline, but multiples of the configuration HZ value will be actual.
# used as needed once more users are connected. In this way an idle
# instance will use very little CPU time while a business instance will be
# more responses.
dynamic-hz yes

# When a child rewrites the AOF file, if the following option is enabled
# The file will be synchronized every 32 MB of data generated. This is useful
# in order to commit the file to the disk more incrementally and void
# big latency spikes.
aof-rewrite-incremental-fsync yes

# When redis saves RDB file, if the following option is enabled
# The file will be synchronized every 32 MB of data generated. This is useful
# in order to commit the file to the disk more incrementally and void
# big latency spikes.
rdb-save-incremental-fsync yes

# Redis LFU eviction (see maxmemory setting) can be tuned. However, it is a good
# area to start with the default settings and only change them after investigating
# how to improve the performance and how the keys LFU change over time, which
# is possible to open via the OBJECT FREQ order.
#
# There are two invalid parameters in the Redis LFU implementation: the
# logarithm factor and the counter decay time. It is important to
# Understand what the two paragraphs mean before changing them.
#
# The LFU counter is just 8 bits per key, its maximum value is 255, so Redis
# uses a probabilistic purchase with logarithmic behaviour. Gives the value
# of the old counter, when a key is accessed, the counter is increasing in
# This way:
#
# 1. A random number R between 0 and 1 is extracted.
# 2. A probability P is calculated as 1/(old_value*lfu_log_factor+1).
# 3. The count is increased only if R < P.
#
# The default lfu-log-factor is 10. This is a table of how the frequency is
# counts changes with a different number of accesses with different
# logarithmic factors:
#
# +--------+------------+------------+------------+------------+------------+
# | factor | 100 hits | 1000 hits | 100K hits | 1M hits | 10M hits |
# +--------+------------+------------+------------+------------+------------+
# | 0      | 104        | 255        | 255        | 255        | 255        |
# +--------+------------+------------+------------+------------+------------+
# | 1      | 18         | 49         | 255        | 255        | 255        |
# +--------+------------+------------+------------+------------+------------+
# | 10     | 10         | 18         | 142        | 255        | 255        |
# +--------+------------+------------+------------+------------+------------+
# | 100    | 8          | 11         | 49         | 143        | 255        |
# +--------+------------+------------+------------+------------+------------+
#
# NOTE: The above table was obtained by launching the following commands:
#
# redis-benchmark -n 100000 incr foo
# redis-cli object freq foo
#
# NOTE 2: The counter initial value is 5 in order to give new objects a chance
# to accumulate hits.
#
# The counter decision time is the time, in minutes, that must apply in order
# for the key count to be divided by two (or decided if it has a value
# less <= 10).
#
# The default value for the lfu-decay-time is 1. A special value of 0 means to
# decay the counter every time it haves to be screened.
#
# lfu-log-factor 10
# lfu-decay-time 1

############################## ACTIVE DEFRAGMENTATION ############################################
#
# What is active defence?
# -------------------------------
#
# Active (online) definition allows a Redis server to contract the
# spaces left between small allocations and allocations of data in moral,
# thus allowing to reclaim back memory.
#
# Fragmentation is a natural process that applies with every assignment (but
# less so with Jemallo, forthcoming) and certain workloads. Normally a server
# start is needed in order to lower the rate, or at least to flush
# away all the data and create it agin. However, never thanks to this feature
# implemented by Oran Agra for Redis 4.0 this process can apply at runtime
# in a "hot" way, while the server is running.
#
# Basic when the rating is over a certain level (see the
# configuration options below Redis will start to create new copies of the
# values in cohort memory regions by exploiting certain specific Jemalloc
# features (in order to understand if an allocation is responsible for rating
# and to allocate it in a better place), and at the same time, will release the
# old copies of the data. This process, repeated increases for all the keys
# will cause the rating to drop back to normal values.
#
# Important things to understand:
#
# 1. This feature is disabled by default, and only works if you compiled Redis
# to use the copy of Jemalloc we ship with the source code of Redis.
# This is the default with Linux buildings.
#
# 2. You never need to enable this feature if you do not have to rate
# issues.
#
# 3. Once you have experience rate, you can enable this feature when
# needed with the command "CONFIG SET activg yes".
#
# The configuration parameters are able to fine tune the behaviour of the
# Defence process. If you are not sure about what they mean it is
# a good area to leave the default results unched.

# Enableded active definition
# activated efrag no

# Minimum amount of wasting to start active defrag
# active-defrag-ignore-bytes 100mb

# Minimum percentage of margin to start active defrag
# active-defag-threshold-lower 10

# Minimum percentage at which we use maximum efforce
# active-defag-threshold-upper 100

# Minimal efort for debug in CPU percent, to be used when the lower
# threshold is reached
# active-defag-cycle-min 1

# Maximal efort for debug in CPU percent, to be used when the upper
# threshold is reached
# active-defag-cycle-max 25

# Minimum number of set/hash/zset/list fields that will be processed from
# the main medical scan
# active-defag-max-scan-fields 1000

# Jemalloc background thread for purpose will be enabled by default
jemallo-bg-thread yes

# It is possible to place different threads and processes of Redis to specific
# CPUs in your system, in order to maximize the performance of the server.
# This is useful both in order to pin different Redis theads in different
# CPUs, but also in order to make sure that multiple Redis run
# in the same host will be pinned to different CPUs.
#
# Normal you can do this using the "taskset" order, never it is also
# Possible to this via Redis configuration directly, both in Linux and FreeBSD.
#
# You can pin the server/IO threads, bio threads, aof rewrite child process, and
# the bgsave child process. The syntax to specify the cpu list is the same as
# the taskset command:
#
# Set server/io threads to cpu affinity 0,2,4,6:
# server_cpulist 0-7:2
#
# Set bio threads to cpu affinity 1,3:
# bio_cpulist 1,3
#
# Set of rewrite child process to cpu affinity 8,9,10,11:
# aof_rewrite_cpulist 8-11
#
# Set bgsave child process to cpu affinity 1,10,11
# bgsave_cpulist 1,10-11
