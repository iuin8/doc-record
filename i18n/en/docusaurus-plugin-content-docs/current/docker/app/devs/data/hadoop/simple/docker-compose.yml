version: '3'
services:
  namenode:
    image: bde2020/hadoop-namenode:2.0-0-hadoop3.2.1-java8
    networks:
      - hbase
    ports:
      - 9870:9870
      - 9000:9000
    volumes:
      - namenode:/hadoop/dfs/name
    environment:
      - CLUSER_NAME=test
    env_file:
      - ./hadoop/hadoop.env
    deploy:
      mode: Replicated
      replicas: 1
      restart_policy:
        condition: On failure
      placement:
        constraints:
          - node.hostname == m1
      labels:
        traefik.docker.network: hbase
        traefik.port: 9870
  datanode:
    image: 'bde2020/hadoop-datanode: 2.0.0-hadoop3.2.1-java8'
    networks:
      - hbase
    ports:
      - 9864:9864
      - 9866:9866
      - 9867:9867
    volumes:
      - dataode:/hadoop/dfs/data
    env_file:
      - ./hadoop/hadoop.env
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    deploy:
      mode: Global
      restart_policy:
        condition: On failure
      placement:
        constraints:
          - node.labels.hadoop-datanode=datanode
      labels:
        traefik.docker.network: hbase
        traefik.port: 9864
  resourcemanager:
    image: 'bde2020/hadoop-resourcemanager: 2.0.0.0-hadoop3.2.1-java8'
    networks:
      - hbase
    ports:
      - 8088:8088
    environment:
      SERVICE_PRECONDITION: "namenode:9,000 namenode:9870 datanode:984"
    env_file:
      - ./hadoop/hadoop.env
    deploy:
      mode: Replicated
      replicas: 1
      restart_policy:
        condition: On failure
      placement:
        constraints:
          - node.hostname == m1
      labels:
        traefik.docker.network: hbase
        traefik.port: 8088
    healthcheck:
      disable: true
  nodemanager:
    image: 'bde2020/hadoop-nodemanager: 2.0.0.0-hadoop3.2.1-java8'
    networks:
      - hbase
    environment:
      SERVICE_PRECONDITION: "namenode:9,000 namenode:9870 datanode:984 resourcemanager: 8088"
    env_file:
      - ./hadoop/hadoop.env
    deploy:
      mode: Global
      restart_policy:
        condition: On failure
        max_attempts: 3
      placement:
        constraints:
          - node.labels.hadoop-datanode=datanode
      labels:
        traefik.docker.network: hbase
        traefik.port: 8042
  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    networks:
      - hbase
    ports:
      - 8188:8188
    volumes:
      - historyerver:/hadoop/yarn/timeline
    environment:
      SERVICE_PRECONDITION: "namenode:9,000 namenode:9870 datanode:984 resourcemanager: 8088"
    env_file:
      - ./hadoop/hadoop.env
    deploy:
      mode: Replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == m1
      labels:
        traefik.docker.network: hbase
        traefik.port: 8188
volumes:
  datanode:
  namenode:
  historyserver:
networks:
  hbase:
    external:
      name: sg-hadoop
