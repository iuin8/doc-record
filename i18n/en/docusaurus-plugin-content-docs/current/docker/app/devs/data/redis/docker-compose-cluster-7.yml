# 部署一主多从哨兵集群
version: '3.8'
services:
  master:
    image: redis:6.2
    networks:
      - redisdb
    ports:
      - 6379:6379
    command:
      - echo 'replica-announcement-ip master' >> sentinel.conf &&
      - echo 'replica-announce-port 6379' >> sentinel.conf &&
      - cat redis.conf &&
      - redis.conf"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
  slave:
    image: redis:6.2
    networks:
      - redisdb
    command:
      - echo 'replica-announce-ip slave' >> sentinel.conf &&
      - echo 'replica-announce-port 6379' >> sentinel.conf &&
      - cat redis.conf &&
      - redis.conf"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - master
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
  sentinel:
    image: redis:6.2
    networks:
      - redisdb
    volumes:
      - /etc/localtime:/etc/localtime:ro
    command:
      - echo 'sentinel down-after-milliseconds master-15000' >> sentinel.conf &&
      - echo 'sentinel fail-timeout master-1,600' >> sentinel.conf &&
      - echo 'sentinel parallel-syncs master-1 1' >> sentinel.conf &&
      - echo 'sentinel announce-ipsentinel' >> sentinel.conf &&
      - echo 'sentinel announuncte-port 26379' >> sentinel.conf &&
      - echo 'sentinel auth-pass master-1 foobared' >> sentinel.conf &&
      - cat sentinel.conf &&
      - redis-sentinel sentinel.conf"
    depends_on:
      - master
      - slave
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
networks:
  redisdb:
    driver: overlay
