version: "3.5"
services:
  adguard:
    image: adguard/adguard home
    networks:
      middleware:
    ports:
      - target: 53
        published: 53
        protocol: tcp
        mode: Post
      - target: 53
        published: 53
        protocol: udp
        mode: Post
      - target: 67
        published: 67
        protocol: udp
        mode: Post
      - target: 68
        published: 68
        protocol: udp
        mode: Post
      - target: 80
        published: 80
        mode: Post
      - target: 443
        published: 443
        protocol: tcp
        mode: Post
      - target: 443
        published: 443
        protocol: udp
        mode: Post
      - target: 3000
        published: 3000
        protocol: tcp
        mode: Post
      - target: 853
        published: 853
        protocol: tcp
        mode: Post
      - target: 784
        published: 784
        protocol: udp
        mode: Post
      - target: 853
        published: 853
        protocol: udp
        mode: Post
      - target: 8853
        published: 8853
        protocol: udp
        mode: Post
      - target: 5443
        published: 5443
        protocol: tcp
        mode: Post
      - target: 5443
        published: 5443
        protocol: udp
        mode: Post
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: On failure
    volumes:
      - adguardhome_work:/opt/adguardhome/work
      - adguardhome_conf:/opt/adguardhome/conf
volumes:
  adguardhome_work:
  adguardhome_conf:
networks:
  middleware:
    external: true
