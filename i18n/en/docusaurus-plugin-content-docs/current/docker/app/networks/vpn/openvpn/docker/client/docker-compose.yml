version: "3"
services:
  openvpn:
    image: curve25519xsalsa20 poly1305/openvpn-socks5
    restart: always
    cap_add:
      - NET_ADMIN
    ports:
      - 1080:1080
    environment:
      - OPEN_CONFIG=/config/config.ovpn
      - SOCKS5_USER=liujinfa
      - SOCKS5_PAS=liujinfa
    volumes:
      - ./config:/config
    devices:
      - /dev/net/tun
