
events:
    Worker_connotations 1024;
}

Web sites

    sendfile on;

    # HTTP Force Jump to HTTPS (optional)
    server
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS Proxy
    server
        listen 443 ssl;
        server_name _;

        ssl_certificate/usr/local/openresy/nginx/conf/certs/cert.pem;
        ssl_certificate_key /usr/local/openresty/nginx/conf/certs/cert.pem;

        Location / LOC:
            proxy_pass http://headscale:9090;
        }

        location/hello
            # Print charters (test)
            add_header Content-Type text/plain;
            return 200 'Main HTTPS server is working!';
        }
    }

}
