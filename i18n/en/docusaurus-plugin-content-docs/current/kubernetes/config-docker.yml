apiVersion: kukey.kubesphere.io/v1alpha2
kind: Cluster
metadata:
  name: Sample
spec:
  hosts:
  - name: master
  address: 10.0.16.146
  internalAddress: "10.0.16.146"
  privateKeyPath: "~/.ssh/id_rsa"
  roleGroups:
    etcd:
    - master
    control-plane:
    - master
    worker:
    - master
    - node1
  controlPlaneEndpoint:
    ## Internal loadbalancer for apiservers
    internalLoadbalancer: habroproxy
    externalDNS: false
    domain: lb.kubesphere.local
    address: ""
    port: 6443
  kubernetes:
    # version: v1.33.1
    version: v.13.13.17
    clusterName: cluster.local
    autoRenewCerts: true
    # containerManager: containerd
    containerManager: docker
  etcd:
    type: kubekey
  network:
    plugin: calico
    kubePodsCIDR: 10.233.64.0/18
    kubeServiceCIDR: 10.233.0.0/18
  ## multus support. https://github.com/k8snetworkplumbingwg/multus-cni
  # multusCNI:
  #   enabled: false
  addons: [ ]
