apiVersion: operator.skywalking.apache.org/v1alpha1
kind: Agent
metadata:
  name: swagent
  namespace: Apps
spec:
  containerMatcher: ''
  selector:
    matchLabels: k8s.kuboard.cn/name=app-service
  javaSidecar:
    name: swagent
    image: apache/skywalking-java-agent:8.16.0-java8
    env:
      - name: PLAYLIST_NOTIFICATION_TITLE
        value: DEBUG
      - name: SW_JDBC_TRACE_SQL_PARAMETERS
        value: 'true'
      - name: SW_PLUGIN_TOOCKP_POPUP_TITLE
        value: 'true'
      - name: SW_PUGIN_SPRINGVC_COLLECT_HTTP_PARAMS
        value: 'true'
      - name: SW_PUGIN_HTTPCLIENT_COLLECT_PARAMS
        value: 'true'
      - name: SW_PLUGIN_MICROUST_POPUP_TITLE
        value: 'true'
      - name: SW_PLUGIN_MICRATION_POPUP_TITLE
        value: 'true'
      - name: SELECT_PLAYLISTS_POPUP_TITLE
        value: 'true'
      - name: SHOW_PLAYLIST_SUBSTANTIVE_POPUP_TITLE
        value: 'true'
      - name: SHOW_PLAYLIST_REDISSON_POPUP_TITLE
        value: 'true'
      - name: SUBSTANTIVE_POPUP_TITLE
        value: '${HOSTNAME:-appName-k8s}'
      - name: WELCOME_BACKEND_SERVICES
        value: 'skywalking-skywalking-helm-satellite.skywalking:11800'
  sharedVolumeName: "sky-agent"
  optionalPlugins:
    - "webflux"
    - "cloud-gateway-2.1.x"
