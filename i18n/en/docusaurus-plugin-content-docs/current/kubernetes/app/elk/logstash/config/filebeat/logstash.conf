# beats' forthcoming reports, default 5044
input LOR
  beats
    Import => 5044
  }
}
# Output Log Method
Outgoing 
# Log categories by log tags, log labels will be defined in filebeat
 if "user-log" in [tags]
    elasticsearch LOs
      hosts => ["http://172.16.188.7:9200"]
      index => "[user-log]-%{+YYYY.MM.dd}"
    }
 }
 if "order-log" in [tags]
    elasticsearch LOs
      hosts => ["http://172.16.188.7:9200"]
      index => "[order-log]-%{+YYYY.MM.dd}"
    }
 }
}
