// group 'com.iuin'
// version '2.0.0.0'

Subprojects
    task publishToest(type: Execution)

        // Configure dependencies - make sure bootJar tasks exist first
        afterEvaluate
            if (project.tasks.findByName('bootJ'))
                dependsOn 'bootJar'
            }
        }

        // Script directory (absolute path)
        def scriptDir = new File(rootProject.rootDir, "script").absolutePath
        def baseScriptPath = new File(scriptDir, "base.sh").absolutePath

        doFirst
            def scriptFile = file(baseScriptPath)
            if (!scriptFile.exists()
                throw new GradleException("脚本文件不存在: ${baseScriptPath}")
            }
            if (!scriptFile.canExecute()
                throw new GradleException("脚本没有执行权限: ${baseScriptPath}")
            }
        }

        // Critical：Specifies the work directory where the script is executed (directory where the script is)
        workingDir = scriptDir

        // Execute command
        commandLine 'bash', '-c', "set -x; ./base.sh -d ${rootProject.rootDir} -s ${project.name}"

        // Core configuration：ignores non-zero exit code for command, continue
        ignoreExitValue = true

        // Capture output
        if output = new ByteArrayOutputStream()
        def error = new ByteArrayOutputStream()
        standard output = output
        Error Output= error

        doLast
            println "Script output:\n${output.toString()}"
            if (error.toString().trim().length() >
                // Printing errors only, not terminating execution
                println "Script error:\n${error.toString()}"
            }

            // Optional：different treatment based on exit code
            def exitCode = executionResult.get().exitValue
            if (exitCode != 0)
                println "注意：脚本执行返回非零退出码 ${exitCode}，但已忽略错误继续执行"
            }
        }
    }
}
