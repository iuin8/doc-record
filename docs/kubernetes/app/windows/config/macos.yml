apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: macos-local-storage
volumeBindingMode: WaitForFirstConsumer # 延迟绑定：保证 Pod 调度成功后才触发 PVC 与 PV 绑定
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: macos-local-pv
spec:
  capacity:
    storage: 64Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: macos-local-storage
  local:
    path: /var/lib/macos-storage
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values:
                - linux
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: macos-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Gi
  volumeMode: Filesystem
  storageClassName: macos-local-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: macos
  namespace: default
  labels:
    app.kubernetes.io/name: macos
    app.kubernetes.io/instance: macos-prod
    app.kubernetes.io/component: virtual-machine
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate # 强占型硬件资源，避免滚动更新导致双副本冲突
  selector:
    matchLabels:
      app.kubernetes.io/name: macos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: macos
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      restartPolicy: Always
      terminationGracePeriodSeconds: 120
      dnsPolicy: ClusterFirst
      
      # 🛠 生产级自动初始化：
      # 1. 自动就地创建物理目录并赋权
      # 2. 动态拓容宿主机系统的 inotify 实例上限，彻底根治 Dnsmasq 网络初始化报错
      # 3. 防锁死逻辑：新实例启动前，自动排查并强制干掉宿主机残留的死锁磁盘文件的旧 QEMU 僵尸进程
      initContainers:
        - name: auto-dir-sysctl-and-lock-cleaner
          image: alpine:latest
          imagePullPolicy: IfNotPresent
          command: 
            - "sh"
            - "-c"
            - |
              mkdir -p /mnt/host-storage && chmod 777 /mnt/host-storage
              sysctl -w fs.inotify.max_user_instances=1024
              sysctl -w fs.inotify.max_user_watches=1048576
              
              TARGET_IMG="/mnt/host-storage/15/data.img"
              if [ -f "$TARGET_IMG" ]; then
                echo "Checking file lock for $TARGET_IMG ..."
                PID=$(pgrep -f "data.img" || true)
                if [ ! -z "$PID" ]; then
                  echo "Found residual process $PID holding the disk lock. Terminating..."
                  kill -15 $PID || kill -9 $PID
                  sleep 2
                fi
              fi
          volumeMounts:
            - name: host-raw-path
              mountPath: /mnt/host-storage
          securityContext:
            privileged: true 
            
      containers:
        - name: macos
          image: dockurr/macos:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: VERSION
              value: "15"
            - name: DISK_SIZE
              value: "64G"
            - name: RAM_SIZE
              value: "8G"
            - name: CPU_CORES
              value: "4"
          ports:
            - containerPort: 8006
              name: web-http
              protocol: TCP
            - containerPort: 5900
              name: vnc-tcp
              protocol: TCP
            - containerPort: 5900
              name: vnc-udp
              protocol: UDP
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 10Gi # 预留 2Gi 给宿主机 QEMU 进程自身开销，防止大文件读写时 OOM
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - SYS_RESOURCE
          readinessProbe:
            tcpSocket:
              port: 8006
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5900
            initialDelaySeconds: 120
            periodSeconds: 20
          volumeMounts:
            - mountPath: /storage
              name: storage-volume
            - mountPath: /dev/kvm
              name: dev-kvm
            - mountPath: /dev/net/tun
              name: dev-tun
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: macos-pvc
        - name: host-raw-path
          hostPath:
            path: /var/lib/macos-storage
            type: DirectoryOrCreate
        - hostPath:
            path: /dev/kvm
            type: CharDevice
          name: dev-kvm
        - hostPath:
            path: /dev/net/tun
            type: CharDevice
          name: dev-tun
---
# 🔒 生产级网络安全暴露：ClusterIP 模式
apiVersion: v1
kind: Service
metadata:
  name: macos-service
  namespace: default
  labels:
    app.kubernetes.io/name: macos
spec:
  type: ClusterIP # 仅在集群内部暴露网络，安全且节省宿主机端口资源
  selector:
    app.kubernetes.io/name: macos
  ports:
    - name: web-http
      protocol: TCP
      port: 8006       # 集群内部访问端口，可在 Ingress 中直接引用
      targetPort: 8006 # 精准映射到容器内的 8006 端口
    - name: vnc-tcp
      protocol: TCP
      port: 5900
      targetPort: 5900
