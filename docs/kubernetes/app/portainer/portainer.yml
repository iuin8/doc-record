apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: default
  labels:
    app: portainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      # 1. 强制指定节点
      nodeName: master1
      
      # 2. 容忍 Master 污点，允许 Pod 运行
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: portainer
          image: portainer/portainer-ce:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
            - name: https
              containerPort: 9443
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        # 3. 使用 hostPath 直接挂载 master1 的本地目录（最稳妥，无需存储插件）
        - name: data
          hostPath:
            path: /var/lib/portainer
            type: DirectoryOrCreate # 自动创建目录
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: portainer
  namespace: default
  labels:
    app: portainer
spec:
  type: ClusterIP
  selector:
    app: portainer
  ports:
    - name: http
      port: 9000
      targetPort: 9000
    - name: https
      port: 9443
      targetPort: 9443