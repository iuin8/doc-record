# DaemonSet: node-debug
# 用途：通过 $ kubectl exec 进入 Pod 后执行 nsenter -t 1 -a 获得宿主机 root shell
# 部署前根据需要：
#   1. 决定是否启用 nodeSelector 限制范围
#   2. 确认容器运行时 socket 路径（containerd / docker）
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-debug
  namespace: kube-system
  labels:
    app: node-debug
spec:
  selector:
    matchLabels:
      app: node-debug
  template:
    metadata:
      labels:
        app: node-debug
    spec:
      # --- 宿主机访问通道 ---
      hostPID: true            # 必须：nsenter 通过宿主机 PID 1 定位 namespace 入口
      # hostNetwork: true      # 非必须：nsenter -t 1 -n 可随时切换，按需启用
      # hostIPC: true          # 非必须：nsenter -t 1 -i 可随时切换，按需启用

      # --- 容忍所有污点,确保能部署到 control-plane ---
      tolerations:
        - operator: Exists

      # --- 按需启用：仅部署到指定节点 ---
      # nodeSelector:
      #   debug: "true"

      containers:
        - name: debug
          # netshoot: 集成了 nsenter / tcpdump / iproute2 / curl / jq / strace 等诊断工具
          image: nicolaka/netshoot:v0.13
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]

          securityContext:
            capabilities:
              add:
                - SYS_ADMIN       # nsenter 切换 namespace 必须
            # privileged: true    # 懒人模式：一步到位的权限。如果 SYS_ADMIN 不够（如需要操作 /dev、加载内核模块等），
                                  # 可替换上面三行为 privileged: true

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi

          # volumeMounts:            # 按需启用：nsenter -t 1 -a 后已接管宿主机文件系统，通常不需要额外挂载
          #   - name: host-root
          #     mountPath: /host
          #   - name: containerd-sock
          #     mountPath: /run/containerd/containerd.sock
          #     readOnly: true
          #   - name: cgroup
          #     mountPath: /sys/fs/cgroup
          #     readOnly: true

      # volumes:
      #   - name: host-root
      #     hostPath:
      #       path: /
      #       type: Directory
      #   - name: containerd-sock
      #     hostPath:
      #       path: /run/containerd/containerd.sock
      #       type: Socket
      #   - name: cgroup
      #     hostPath:
      #       path: /sys/fs/cgroup
      #       type: Directory
