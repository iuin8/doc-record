# 基础配置
mode: rule            # 显式指定分流模式
allow-lan: true       # 允许内网/容器连接
# 总结建议：在你的 Docker host 模式部署中，将 bind-address 设置为 127.0.0.1 是最安全的做法，它能确保只有这台服务器内部的流量（含容器）能与 Mihomo 交互，而不会把代理接口暴露给整个局域网。
bind-address: '*'     # 生产环境建议改为您的内网 IP 如 10.0.1.111(这里是部署docker容器的服务器IP), 或者是 '0.0.0.0'。或者是 '127.0.0.1'。
mixed-port: 7890
log-level: info
ipv6: false

# DNS 配置 (TUN 模式的核心，防止 DNS 污染)
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - 223.5.5.5 # 阿里 DNS
    - 119.29.29.29 # 腾讯 DNS
  proxy-server-nameserver:
    - 8.8.8.8
  nameserver-policy:
    "geosite:cn": [223.5.5.5, 119.29.29.29]

# TUN 模式配置：自动接管宿主机及容器流量
tun:
  enable: true
  stack: system
  auto-route: true     # 自动设置系统路由
  auto-detect-interface: true
  dns-hijack:
    - "any:53"

# 代理节点
proxies:
  - name: "My-Proxy-Node"
    type: http
    server: 10.0.4.95
    port: 7897

# 分流策略组
proxy-groups:
  - name: "FINAL"
    type: select
    proxies:
      - "My-Proxy-Node"
      - DIRECT

# 分流规则 (权威来源：GeoSite/GeoIP)
rules:
  # 1. 局域网和本地流量直连
  - GEOIP,private,DIRECT,no-resolve
  
  # 2. 中国大陆域名直连 (需 Mihomo 自动下载 Geosite 库)
  - GEOSITE,cn,DIRECT
  
  # 3. 中国大陆 IP 直连
  - GEOIP,cn,DIRECT
  
  # 4. 剩余所有流量（海外）走代理
  - MATCH,FINAL
