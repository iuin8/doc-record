services:
  jenkins:
    image: jenkins/jenkins:lts-alpine
    user: root
    dns:
      - 114.114.114.114
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /bin/docker:/bin/docker
    environment:
      TZ: "Asia/Shanghai"
      JAVA_OPTS: "-Dsun.jnu.encoding=UTF-8 -Dfile.encoding=UTF-8"
      # 代理环境变量
      HTTPS_PROXY: http://host.docker.internal:9093
      HTTP_PROXY: http://host.docker.internal:9093
      ALL_PROXY: socks5://host.docker.internal:9093
      # 小写版本也需要设置，某些工具可能只识别小写
      https_proxy: http://host.docker.internal:9093
      http_proxy: http://host.docker.internal:9093
      all_proxy: socks5://host.docker.internal:9093
      # 不需要代理的域名
      NO_PROXY: "localhost,127.0.0.1,*.local,host.docker.internal"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - target: 8080
        published: 18080
        mode: host
    # networks:
    #   - middleware
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
      restart_policy:
        condition: on-failure

volumes:
  jenkins_home:

