configs:
  jumpboxs_config:
    content: |
      {
        "bindAddr": "0.0.0.0",
        "bindPort": 7000,
        "auth": {
          "method": "token",
          "token": "jumpbox"
        },
        "transport": {
          "maxPoolCount": 5,
          "tcpMux": true,
          "tcpMuxKeepaliveInterval": 60,
          "tcpKeepalive": 7200,
          "heartbeatTimeout": 90,
          "tls": {
            "force": false
          }
        },
        "tcpmuxHTTPConnectPort": 7001,
        "webServer": {
          "addr": "127.0.0.1",
          "port": 7500,
          "user": "admin",
          "password": "admin"
        },
        "allowPorts": [
          {
            "start": 1000,
            "end": 65535
          }
        ],
        "maxPortsPerClient": 0,
        "detailedErrorsToClient": true
      }

services:
  jumpboxs:
    image: registry.cn-hangzhou.aliyuncs.com/iuin/jumpboxs:v0.66.0_v6.3.1
    container_name: jumpboxs
    network_mode: host
    environment:
      TZ: "Asia/Shanghai"
    configs:
      - source: jumpboxs_config
        target: /www/jumpbox/config/jumpboxs_config.json
        mode: 0777
    restart: unless-stopped
